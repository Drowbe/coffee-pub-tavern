# Coffee Pub Magpie - paste this into QNAP Container Station (Applications >
# Create) or run with `docker compose up -d` anywhere. No files to edit on the
# NAS: everything is set below. Replace the CHANGE_ME values.
#
# Before starting:
#   DNS:    magpie.<domain> and livekit.<domain> -> your public IP (DNS only, not proxied)
#           (for several environments, also *.magpie.<domain>, and a wildcard certificate: see the guide)
#   Router: forward 7881/tcp, 7882/udp and 3478/udp to the NAS
#   Proxy:  Nginx Proxy Manager hosts with TLS:
#             livekit.<domain> -> NAS:7880 (Websockets Support ON)
#             magpie.<domain>  -> NAS:3000
version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:latest # 1.12 or newer
    container_name: magpie-livekit
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "7880:7880/tcp" # signaling, behind the reverse proxy
      - "7881:7881/tcp" # media over TCP (fallback)
      - "7882:7882/udp" # media over UDP
      - "3478:3478/udp" # TURN
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          domain: livekit.CHANGE_ME_DOMAIN
          udp_port: 3478
        keys:
          CHANGE_ME_API_KEY: CHANGE_ME_API_SECRET
        logging:
          level: info

  magpie:
    image: ghcr.io/drowbe/coffee-pub-tavern:latest
    container_name: magpie-app
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "3000:3000/tcp" # behind the reverse proxy
    environment:
      LIVEKIT_HOST: "livekit.CHANGE_ME_DOMAIN"
      LIVEKIT_API_KEY: "CHANGE_ME_API_KEY"
      LIVEKIT_API_SECRET: "CHANGE_ME_API_SECRET"
      # The owner's account (the game master). Created on first start; if you ever forget
      # the password, change it here and restart the container. OWNER_PASSWORD was
      # ADMIN_PASSWORD, which is still read for now.
      ADMIN_USER: "gm"
      OWNER_PASSWORD: "CHANGE_ME_OWNER_PASSWORD"
      # Several environments on one server (see the getting-started guide, "Environments"): set the base
      # domain, drop the ADMIN_USER and OWNER_PASSWORD lines above, and add the next three for ONE start only.
      # BASE_DOMAIN: "magpie.CHANGE_ME_DOMAIN"
      # MIGRATE_ENVIRONMENT_SLUG: "thepub"
      # HOST_ADMIN_LOGIN: "CHANGE_ME"
      # HOST_ADMIN_PASSWORD: "CHANGE_ME"
      # PRODUCT_NAME: "CHANGE_ME"        # optional: the product page's name
      # CONTACT_EMAIL: "you@example.com" # optional: where the product page's "ask" writes to
      # SIGNUP: "on"                     # lets anyone make a free environment from the product page; off unless set
      # The AI the host offers every environment (each picks it as "Managed", or sets up its own): a key is
      # enough, the model is chosen for you and can be changed on the host console. Either or both.
      # AI_OPENAI_KEY: "sk-..."
      # AI_ANTHROPIC_KEY: "sk-ant-..."
      # AI_ANTHROPIC_WORKSPACE: "wrkspc_..." # only for a key made at the organisation level; Anthropic then asks which workspace
      # Two-step sign-in (a code from an authenticator app). ENABLE_MFA says whether the server offers it at all;
      # each environment's admin then chooses to require it, and each person chooses to use it. If an admin is
      # locked out, turn the bypass on, sign in, reset the factor on the profile, turn the bypass off again.
      ENABLE_MFA: "true"
      ADMIN_MFA_LOCKOUT_BYPASS: "false"
      # HOST_MFA_REQUIRED: "true"   # with environments: every host admin must use it
      PORT: "3000"
    volumes:
      - /share/appdata/magpie:/app/data # users, settings and images
