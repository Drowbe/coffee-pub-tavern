# Coffee Pub Tavern - paste this into QNAP Container Station (Applications >
# Create) or run with `docker compose up -d` anywhere. No files to edit on the
# NAS: everything is set below. Replace the CHANGE_ME values.
#
# Before starting:
#   DNS:    tavern.<domain> and livekit.<domain> -> your public IP (DNS only, not proxied)
#   Router: forward 7881/tcp, 7882/udp and 3478/udp to the NAS
#   Proxy:  Nginx Proxy Manager hosts with TLS:
#             livekit.<domain> -> NAS:7880 (Websockets Support ON)
#             tavern.<domain>  -> NAS:3000
version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:latest # 1.12 or newer
    container_name: tavern-livekit
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "7880:7880/tcp" # signaling, behind the reverse proxy
      - "7881:7881/tcp" # media over TCP (fallback)
      - "7882:7882/udp" # media over UDP
      - "3478:3478/udp" # TURN
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          domain: livekit.CHANGE_ME_DOMAIN
          udp_port: 3478
        keys:
          CHANGE_ME_API_KEY: CHANGE_ME_API_SECRET
        logging:
          level: info

  tavern:
    image: ghcr.io/drowbe/coffee-pub-tavern:latest
    container_name: tavern-app
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "3000:3000/tcp" # behind the reverse proxy
    environment:
      LIVEKIT_HOST: "livekit.CHANGE_ME_DOMAIN"
      LIVEKIT_API_KEY: "CHANGE_ME_API_KEY"
      LIVEKIT_API_SECRET: "CHANGE_ME_API_SECRET"
      # The game master's account. Created on first start; if you ever forget
      # the password, change it here and restart the container.
      TAVERN_ADMIN_USER: "gm"
      TAVERN_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
      PORT: "3000"
    volumes:
      - /share/appdata/tavern:/app/data # users, settings and images
