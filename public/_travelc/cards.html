.harness-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }

.harness-frame { display: block; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.app { padding: 12px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
.ic { display: inline-flex; align-items: center; flex: none; }
.ic svg { width: 1em; height: 1em; fill: currentColor; }

<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
const accent = q.get('accent') || 'orange';
if (theme === 'light') document.documentElement.classList.add('light');
if (accent !== 'orange') document.documentElement.classList.add(accent);

if (!q.has('bare')) {
  document.body.className = 'harness';
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="harness-bar">${opt('theme', ['dark', 'light'], theme)}${opt('accent', ['orange', 'blue', 'green'], accent)}${opt('size', ['phone', 'pane', 'wide'], size)}<span class="hint">the colours follow the accent</span></div>`);
  const w = { phone: 390, pane: 560, wide: 900 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 660}px`;
  f.src = `cards.html?bare=1&theme=${theme}&accent=${accent}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
  }));
} else {
  const ic = (name) => `<span class="ic" data-icon="${name}"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
  const own = (n) => n && n.length ? `<span class="owners" data-slot="owners" title="${n.join(', ')}">${n.map((x) => `<span class="owner">${x.slice(0, 2 === 1 ? 1 : 1)}</span>`).join('')}</span>` : '';
  const menu = `<button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu">${ic('ellipsis')}</button>`;
  const pill = (t, cls = '') => `<span class="pill ${cls}">${t}</span>`;
  const MODE = { walk: 'person-walking', drive: 'car', transit: 'bus', bike: 'bicycle', taxi: 'taxi' };
  const TYPEICON = { flight: 'plane', train: 'train', ferry: 'ship', bus: 'bus', car: 'car', hotel: 'bed', restaurant: 'utensils', cafe: 'mug-hot', bar: 'martini-glass', sight: 'monument', museum: 'building-columns', tour: 'person-hiking', show: 'masks-theater', note: 'note-sticky', place: 'location-dot', link: 'calendar-days' };
  const KICK = { flight: 'Flight', train: 'Train', ferry: 'Ferry', bus: 'Bus', car: 'Rental car', hotel: 'Hotel', restaurant: 'Restaurant', cafe: 'Café', bar: 'Bar', sight: 'Sight', museum: 'Museum', tour: 'Tour', show: 'Show', note: 'Note', place: 'Saved place' };

  const card = (it) => {
    const t = it.type;
    const ico = ic(TYPEICON[t]);
    if (t === 'flight') return `<article class="card pass" data-type="flight"><div class="pass-main"><div class="pass-top"><span class="badge">${ico}</span><div class="who"><span class="kicker">Flight</span><h3 data-slot="title">${it.operator} · ${it.number}</h3></div></div><div class="route"><div class="end"><b class="code" data-slot="fromCode">${it.fromCode}</b><span class="city">${it.from}</span><span class="t">${it.time}</span></div><div class="path"><span class="line"></span>${ic('plane')}<span class="dur">${it.dur}</span></div><div class="end to"><b class="code" data-slot="toCode">${it.toCode}</b><span class="city">${it.to}</span><span class="t">${it.arr}</span></div></div></div><div class="stub"><div><small>Seat</small><b>${it.seat}</b></div><div><small>Gate</small><b>${it.gate}</b></div><div><small>Class</small><b>${it.travelClass}</b></div><span class="bars"></span></div>${menu}</article>`;
    if (t === 'train') return `<article class="card ticket" data-type="train"><header class="strip"><span class="badge">${ico}</span><div class="who"><span class="kicker">Train</span><h3>${it.operator} ${it.number}</h3></div>${pill('Platform ' + it.platform)}</header><div class="stations"><div class="st"><span class="t">${it.time}</span><b>${it.from}</b></div><div class="track">${ic('train')}</div><div class="st to"><span class="t">${it.arr}</span><b>${it.to}</b></div></div><div class="foot">${pill('Coach ' + it.carriage + ' · seat ' + it.seat)}${pill(it.dur)}${it.confirm ? pill(it.confirm, 'code') : ''}</div>${menu}</article>`;
    if (t === 'ferry' || t === 'bus' || t === 'car') return `<article class="card transit" data-type="${t}"><span class="badge">${ico}</span><div class="main"><span class="kicker">${KICK[t]}${it.operator ? ' · ' + it.operator : ''}</span><h3>${it.title}</h3><div class="go"><span class="tm">${it.time}</span>${ic('plane').replace('plane', 'arrow-right').replace('#i-plane', '#i-arrow-right')}<span>${it.to}</span>${it.confirm ? pill(it.confirm, 'code') : ''}</div></div>${menu}</article>`;
    if (t === 'hotel' && it.span === 'mid') return `<article class="card stay mid" data-type="hotel" data-span="middle"><span class="badge">${ico}</span><h3>Staying at ${it.title}</h3>${menu}</article>`;
    if (t === 'hotel') return `<article class="card stay" data-type="hotel"><div class="band"><span class="badge">${ico}</span><div class="main"><span class="kicker">Hotel</span><h3 data-slot="title">${it.title}</h3><p>${it.address}</p></div><span class="nights">${it.nights} nights</span></div><div class="ins"><div><small>Check in</small><b>${it.checkin}</b></div><span class="sep"></span><div><small>Check out</small><b>${it.checkout}</b></div></div><div class="foot chips2">${pill(it.roomType)}${pill(it.guests + ' guests')}${pill(it.confirm, 'code')}${own(it.owners)}</div>${menu}</article>`;
    if (t === 'restaurant' || t === 'cafe' || t === 'bar') return `<article class="card meal" data-type="${t}"><span class="badge">${ico}</span><div class="main"><span class="kicker">${it.kicker || KICK[t]}</span><h3>${it.title}</h3><p>${it.address}</p><div class="chips2">${it.partySize ? pill('Table for ' + it.partySize) : ''}${it.reservationName ? pill('under ' + it.reservationName) : ''}${own(it.owners)}</div></div><div class="side"><b>${it.when}</b>${it.minutes ? `<small>${it.minutes} min</small>` : ''}</div>${menu}</article>`;
    if (t === 'show') return `<article class="card admit" data-type="show"><div class="body"><span class="badge">${ico}</span><div><span class="kicker">${it.kicker || 'Show'}</span><h3>${it.title}</h3><p>${it.address}</p><div class="chips2">${pill(it.gate)}${it.confirm ? pill(it.confirm, 'code') : ''}${own(it.owners)}</div></div></div><div class="stub"><small>Admit</small><b>${it.admissionCount}</b><small>${it.time}</small></div>${menu}</article>`;
    if (t === 'sight' || t === 'museum' || t === 'tour') return `<article class="card act" data-type="${t}"><span class="badge">${ico}</span><div class="main"><span class="kicker">${KICK[t]}</span><h3>${it.title}</h3><p>${it.address}</p><div class="chips2">${it.minutes ? pill(ic('clock') + ' ' + it.minutes + ' min') : ''}${it.admissionCount ? pill(it.admissionCount + ' tickets') : ''}${it.confirm ? pill(it.confirm, 'code') : ''}${own(it.owners)}</div></div>${menu}</article>`;
    if (t === 'note') return `<article class="card note" data-type="note"><span class="kicker">Note</span><h3>${it.title}</h3><p>${it.body}</p></article>`;
    if (t === 'place') return `<article class="card placecard" data-type="place"><span class="badge">${ico}</span><div class="main"><span class="kicker">Saved place</span><h3>${it.title}</h3><p>${it.address}</p></div>${menu}</article>`;
    if (t === 'link') return `<article class="card linkcard" data-type="link"><div class="src">${ic(it.icon)} from ${it.source}</div><h3>${it.title}</h3><p>${it.sub}</p>${menu}</article>`;
    return '';
  };
  const row = (it) => `<li class="row entry" data-type="${it.type}"><div class="when"><b>${it.when || ''}</b><small>${it.whenSub || ''}</small></div><div class="rail"><span class="dot"></span></div><div class="slot">${card(it)}</div></li>`;
  const leg = (mode, min, dist) => `<li class="row leg-row"><div class="when"></div><div class="rail"></div><div class="slot"><button class="leg" type="button" data-mode="${mode}" data-action="edit-leg">${ic(MODE[mode])}<span>${min} min</span>${dist ? `<span class="dist">· ${dist}</span>` : ''}</button></div></li>`;

  const day1 = [
    { type: 'flight', when: '17:40', whenSub: 'Sat', operator: 'TAP Air Portugal', number: 'TP 214', fromCode: 'DEN', toCode: 'LIS', from: 'Denver', to: 'Lisbon', time: '17:40', arr: '10:05 +1', dur: '10 h 25', seat: '23A', gate: 'B12', travelClass: 'Economy' },
    { type: 'note', when: '', title: 'Landing in the morning', body: 'Text the hotel from the plane: early check-in is possible after 11:00.' },
  ];
  const day2 = [
    { type: 'car', when: '10:05', operator: 'Airport transfer', title: 'Pick-up at arrivals', to: 'Hotel Avenida Palace', time: '11:00', confirm: 'TRF-4471' },
    { leg: ['drive', 25, '9 km'] },
    { type: 'hotel', when: '11:30', whenSub: 'check-in', title: 'Hotel Avenida Palace', address: 'Rua 1º de Dezembro 101, Lisbon', nights: 5, checkin: 'Sun 4 · 15:00', checkout: 'Fri 9 · 11:00', roomType: 'Double, city view', guests: 2, confirm: 'BK-88213', owners: ['Thomas'] },
    { leg: ['walk', 12, '0.9 km'] },
    { type: 'cafe', when: '12:00', title: 'A Brasileira', address: 'R. Garrett 120', kicker: 'Coffee break', partySize: 4, minutes: 45, owners: ['Alicia'] },
    { leg: ['walk', 6, '450 m'] },
    { type: 'museum', when: '13:30', title: 'Museu do Azulejo', address: 'R. Me. Deus 4', minutes: 90, admissionCount: 4, confirm: 'AZ-2210', owners: ['Cliff', 'Christy'] },
    { leg: ['transit', 18, ''] },
    { type: 'sight', when: '16:00', title: 'Belém Tower', address: 'Av. Brasília', minutes: 60, admissionCount: 4 },
    { leg: ['walk', 9, '700 m'] },
    { type: 'restaurant', when: '20:00', title: 'Cervejaria Ramiro', address: 'Av. Almirante Reis 1', partySize: 5, reservationName: 'Thomas', owners: ['Thomas', 'Mark'], minutes: 120 },
    { leg: ['taxi', 14, '5 km'] },
    { type: 'show', when: '22:30', title: 'Fado at Casa de Linhares', address: 'Beco dos Armazéns do Linho 2', admissionCount: 4, gate: 'Doors 22:00', confirm: 'FD-908', time: '22:30', owners: ['Thomas'] },
  ];
  const day3 = [
    { type: 'hotel', when: '', title: 'Hotel Avenida Palace', span: 'mid' },
    { type: 'train', when: '08:12', operator: 'CP Comboios', number: 'IC 522', platform: '4', from: 'Lisboa Oriente', to: 'Porto Campanhã', time: '08:12', arr: '11:20', carriage: '5', seat: '32', dur: '3 h 08', confirm: 'CP7Q2Z' },
    { leg: ['walk', 15, '1.1 km'] },
    { type: 'ferry', when: '12:30', operator: 'Douro Cruises', title: 'Douro river crossing', to: 'Vila Nova de Gaia', time: '12:30', confirm: 'DR-19' },
    { type: 'tour', when: '14:00', title: 'Port cellar tour', address: 'Rua Cândido dos Reis', minutes: 75, admissionCount: 4 },
    { type: 'bar', when: '18:30', title: 'Wine terrace', address: 'Cais de Gaia', kicker: 'Sundowner', partySize: 4 },
    { type: 'place', when: '', title: 'Best pastéis (saved)', address: 'R. de Belém 84–92' },
    { type: 'link', when: '', icon: 'list-check', source: 'To-do', title: 'Buy tram day passes', sub: 'Due Mon 5 Oct · Cliff' },
  ];
  const line = (arr, n, label, head) => `<section class="day2"><header class="day-head2"><div class="dnum"><b>${n}</b><span>${label}</span></div><div class="dmeta"><h2>${head[0]}</h2><p>${head[1]}</p></div></header><ol class="timeline">${arr.map((x) => (x.leg ? leg(...x.leg) : row(x))).join('')}</ol></section>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="app" id="app">${line(day1, 3, 'Sat · Oct', ['Day 1 of 7', 'Getting there · 1 flight'])}${line(day2, 4, 'Sun · Oct', ['Day 2 of 7', '10:05 – 23:30 · 6 stops · 1 h 24 min getting around'])}${line(day3, 5, 'Mon · Oct', ['Day 3 of 7', 'To Porto and back · 1 train, 1 ferry'])}</div>`);
  const app = document.getElementById('app');
  const fit = () => app.classList.toggle('narrow', document.body.clientWidth < 720);
  fit(); new ResizeObserver(fit).observe(document.body);
}
</script>
