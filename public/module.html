<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'">
  <link rel="icon" href="/img/site/icon">
  <title>Coffee Pub Tavern - Module</title>
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css" id="theme-link">
</head>
<body class="module-page">
  <header class="topbar"></header>

  <!-- A module in a window of its own has a titlebar like the room's panes, with the way back
       to a column beside the call or a floating panel. -->
  <header class="mod-header module-titlebar" id="module-titlebar" hidden>
    <span class="module-panel-title"><i class="fa-solid fa-fw" id="module-titlebar-icon" aria-hidden="true"></i> <span id="module-titlebar-title"></span></span>
    <span class="mod-header-tools">
      <span class="titlebar-custom" id="module-titlebar-custom"></span>
      <button class="msg-btn" id="module-back-float" type="button" title="Float over the call" aria-label="Float over the call" hidden><i class="fa-regular fa-window-restore fa-fw" aria-hidden="true"></i></button>
      <button class="msg-btn" id="module-back-dock" type="button" title="Dock beside the call" aria-label="Dock beside the call" hidden><i class="fa-solid fa-table-columns fa-fw" aria-hidden="true"></i></button>
      <button class="msg-btn" id="module-close" type="button" title="Close" aria-label="Close"><i class="fa-solid fa-xmark fa-fw" aria-hidden="true"></i></button>
    </span>
  </header>

  <!-- A module's own page: the module runs in a sandboxed frame (see
       module-host.js) and fills everything under the header. -->
  <main class="module-stage">
    <iframe class="module-frame" id="module-frame" title="Module" hidden></iframe>
    <div class="module-bar" id="module-bar" hidden></div>
    <p class="hint module-missing" id="module-missing" hidden>That module is not available.</p>
  </main>

  <script src="/sdk/tavern.js" data-tavern-host></script>
  <script type="module" src="/module.js"></script>
</body>
</html>
