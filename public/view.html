<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:">
  <title>Tavern view</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #f1e6d8; }
    video, .avatar { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: transparent; }
    .avatar { object-fit: contain; }
    .plate { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,0.6); font-weight: 600; font-size: 16px; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a8998a; font-size: 14px; }
    /* talking frame (border=1): matches the green highlight at the table */
    .frame { position: absolute; inset: 0; pointer-events: none; border: 4px solid #6fae6b; border-radius: 8px; box-shadow: inset 0 0 12px rgba(111, 174, 107, 0.6); opacity: 0; transition: opacity 0.12s ease; }
    body.talking .frame { opacity: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-state="offline">
  <img class="avatar" id="avatar" alt="" hidden>
  <div class="msg" id="msg" hidden></div>
  <span class="plate" id="plate" hidden></span>
  <div class="frame"></div>
  <script type="module" src="/view.js"></script>
</body>
</html>
