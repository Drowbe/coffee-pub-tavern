<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:">
  <title>Tavern view</title>
  <style>
    :root { --talk: #6fae6b; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #f1e6d8; container-type: size; }
    video, .layer-wrap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; pointer-events: none; }
    video { object-fit: cover; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; }
    /* Offline/Online picture and its talking/muted overlays -- not the
       camera itself, which always fills the box edge to edge. Rounded only
       for the Participant box; the Character box sits over a character bar
       and stays square. The radius (and the clip) sits on a wrapping div
       rather than the <img> itself, since overflow:hidden on a plain block
       element is the most broadly reliable way to clip a replaced element's
       corners across renderers. 20px reads clearly at typical box sizes --
       10px was correct but too subtle to actually notice. */
    body[data-kind="player"] .layer-wrap { border-radius: 20px; overflow: hidden; }
    /* the Offline / Online picture can sit smaller than the box, on a colour
       or, when the player has their own video-background image (set on the
       profile page, used to replace their real background live), that same
       picture instead -- so a paused camera reads as "them, backed by their
       own background" rather than a flat colour underneath a small portrait. */
    body:not([data-kind="player"]) #base-wrap { inset: var(--pic-inset, 0%); width: calc(100% - 2 * var(--pic-inset, 0%)); height: calc(100% - 2 * var(--pic-inset, 0%)); }
    /* The Participant box is a square portrait, not a crop of the OBS
       box's own (usually wider) shape: sized off the box's own height
       (container query units, since body is a size container) so it
       comes out square regardless of the box's aspect ratio, centred,
       floating over whatever is underneath (background colour or image,
       or nothing). Whatever the uploaded picture's own shape is, cover
       fills that square box completely -- no letterboxed gaps inside it,
       cropping only as much as the picture's own aspect ratio actually
       requires (typically little to none, since these are square
       portraits to begin with). The talking/muted overlays share the same
       square frame so they stay aligned with the (now much smaller)
       picture instead of framing the whole box. */
    body[data-kind="player"] .pic-frame {
      inset: 0;
      margin: auto;
      width: calc(var(--pic-scale, 100) * 1cqh);
      height: calc(var(--pic-scale, 100) * 1cqh);
      clip-path: inset(0 round 20px);
    }
    body[data-kind="player"] #base { object-fit: cover; }
    body.picture-bg[data-state="image"], body.picture-bg[data-state="offline"] { background: var(--pic-bg); }
    #bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Name plate: position (data-plate, set from the Nameplate settings),
       box colour + opacity combined via color-mix, font colour and size. */
    .plate {
      position: absolute;
      box-sizing: border-box;
      padding: 4px 10px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--plate-bg, #000) var(--plate-opacity, 60%), transparent);
      color: var(--plate-color, inherit);
      font-weight: 600;
      font-size: var(--plate-size, 16px);
    }
    .plate[data-plate="upper-left"] { top: 12px; left: 12px; }
    .plate[data-plate="upper-right"] { top: 12px; right: 12px; }
    .plate[data-plate="lower-left"] { bottom: 12px; left: 12px; }
    .plate[data-plate="lower-right"] { bottom: 12px; right: 12px; }
    .plate[data-plate="bottom-center"] { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .plate[data-plate="bottom-full"] { bottom: 0; left: 0; right: 0; border-radius: 0; text-align: center; }
    /* Offline/Aside wash: a plain alpha-blended colour over whatever's
       showing (video included, not just the picture) -- real CSS now
       instead of the OBS Color Correction filter Studio used to apply,
       which corrupted these sources' alpha transparency even at neutral
       settings. Colour and its own opacity both come from --dim (set from
       server settings), so "how dim" and "what colour" are one rgba(),
       not a brightness filter plus a separate tint fighting each other. */
    #dim { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--dim, transparent); pointer-events: none; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a8998a; font-size: 14px; }
    /* talking frame: a real border around the box, any size, never stretched */
    .frame { position: absolute; inset: 0; pointer-events: none; border: var(--talk-w, 6px) solid var(--frame, var(--talk)); border-radius: 8px; box-shadow: inset 0 0 12px color-mix(in srgb, var(--frame, var(--talk)) 60%, transparent); opacity: 0; transition: opacity 0.12s ease; }
    body.talking .frame { --frame: var(--talk); opacity: 1; }
    body.muted-frame .frame { --frame: var(--mute); opacity: 1; }
    /* reactions float up the box and fade */
    /* sized by the box: about a third of its height */
    .reaction { position: absolute; bottom: 25%; font-size: min(34vh, 40vw); line-height: 1; pointer-events: none; animation: reaction-float 2.2s ease-out forwards; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    @keyframes reaction-float {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
      15% { transform: translate(-50%, -4vh) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -40vh) scale(1); opacity: 0; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-state="blank">
  <img id="bg-image" alt="" hidden>
  <div id="base-wrap" class="layer-wrap pic-frame"><img class="layer" id="base" alt="" hidden></div>
  <div class="layer-wrap pic-frame"><img class="layer" id="overlay-talking" alt="" hidden><img class="layer" id="overlay-muted" alt="" hidden></div>
  <div id="dim" hidden></div>
  <div class="frame"></div>
  <div class="msg" id="msg" hidden></div>
  <span class="plate" id="plate" hidden></span>
  <script type="module" src="/view.js"></script>
</body>
</html>
