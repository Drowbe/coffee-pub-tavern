<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:">
  <title>Coffee Pub Tavern - Your image</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img data-brand="icon" alt="" class="icon"><span data-brand="serverName">Coffee Pub Tavern</span></div>
    <nav class="links"><a href="/">Back to the table</a><a href="/logout">Sign out</a></nav>
  </header>

  <div class="panel narrow">
    <h1 id="title">Your image</h1>
    <p class="hint">Shown at the table whenever your camera is off. Square images look best.</p>
    <div class="image-row">
      <img class="preview" id="preview" alt="">
      <div class="stack">
        <label class="btn file-btn">Choose image<input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label>
        <button class="btn btn-danger" id="remove" type="button">Remove</button>
      </div>
    </div>
    <p class="status" id="status"></p>
  </div>

  <script type="module" src="/me.js"></script>
</body>
</html>
