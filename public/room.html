<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:">
  <title>Coffee Pub Tavern</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img data-brand="icon" alt="" class="icon"><span data-brand="serverName">Coffee Pub Tavern</span> <span class="status" id="status"></span></div>
    <div class="controls" id="controls" hidden>
      <button class="btn" id="mic" type="button">Mic</button>
      <button class="btn" id="cam" type="button">Camera</button>
      <select id="mic-select" title="Microphone"></select>
      <select id="cam-select" title="Camera"></select>
      <button class="btn btn-danger" id="leave" type="button">Leave</button>
    </div>
    <nav class="links" id="links">
      <span id="whoami"></span>
      <a href="/me">Your image</a>
      <a href="/admin" id="admin-link" hidden>Manage</a>
      <a href="/logout">Sign out</a>
    </nav>
  </header>

  <div class="panel join" id="join">
    <h1 data-brand="tableName">The Table</h1>
    <p class="hint">Your browser will ask for camera and microphone the first time.</p>
    <button class="btn btn-primary" id="join-button" type="button">Join</button>
    <p class="status error" id="join-error" hidden></p>
  </div>

  <main class="grid" id="grid" hidden></main>

  <script type="module" src="/room.js"></script>
</body>
</html>
