<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:; worker-src 'self'">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>Coffee Pub Tavern</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand"><img data-brand="icon" alt="" class="icon"><span data-brand="serverName">Coffee Pub Tavern</span></div>
    <nav class="links" id="links">
      <span id="whoami"></span>
      <a href="/me">Your image</a>
      <a href="/admin" id="admin-link" hidden>Manage</a>
      <a href="/logout">Sign out</a>
      <span class="version" data-brand="version"></span>
    </nav>
  </header>

  <div class="panel join" id="join">
    <h1 data-brand="tableName">The Table</h1>
    <p class="hint">Your browser will ask for camera and microphone the first time.</p>
    <button class="btn btn-primary" id="join-button" type="button">Join</button>
    <p class="status error" id="join-error" hidden></p>
    <p class="hint install-hint" id="install-hint" hidden></p>
  </div>

  <!-- Everything at the table lives inside the stage so it can pop out as one. -->
  <main class="stage" id="stage" hidden>
    <div class="grid" id="grid"></div>

    <div class="float status-float" id="status-float">
      <span data-brand="serverName">Coffee Pub Tavern</span>
      <span class="status" id="status"></span>
    </div>

    <div class="float floatbar" id="floatbar">
      <button class="fbtn" id="mic" type="button" title="Microphone (M)"><span class="meter" id="meter"></span><span class="glyph">&#127908;</span></button>
      <button class="fbtn" id="cam" type="button" title="Camera (V)"><span class="glyph">&#127909;</span></button>
      <button class="fbtn" id="chat-toggle" type="button" title="Chat (C)"><span class="glyph">&#128172;</span><span class="badge" id="chat-badge" hidden></span></button>
      <button class="fbtn" id="settings-toggle" type="button" title="Settings"><span class="glyph">&#9881;</span></button>
      <button class="fbtn" id="popout" type="button" title="Pop out into its own window" hidden><span class="glyph">&#10697;</span></button>
      <button class="fbtn danger" id="leave" type="button" title="Leave the table"><span class="glyph">&#9742;</span></button>
    </div>

    <aside class="chat" id="chat" hidden>
      <header><span>Chat</span><button class="btn btn-small" id="chat-close" type="button">Close</button></header>
      <div class="messages" id="messages"></div>
      <form id="chat-form"><input id="chat-input" type="text" maxlength="500" placeholder="Say something..." autocomplete="off"><button class="btn btn-primary btn-small" type="submit">Send</button></form>
    </aside>

    <div class="popover" id="settings" hidden>
      <label>Microphone<select id="mic-select"></select></label>
      <label>Camera<select id="cam-select"></select></label>
      <div class="row">
        <button class="btn btn-small" id="install" type="button" hidden>Install as an app</button>
        <span class="hint" id="install-note"></span>
      </div>
      <nav class="links">
        <a href="/me">Your image</a>
        <a href="/admin" id="admin-link-2" hidden>Manage</a>
        <a href="/logout">Sign out</a>
        <span class="version" data-brand="version"></span>
      </nav>
    </div>
  </main>

  <script type="module" src="/room.js"></script>
</body>
</html>
