<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: https:; media-src 'self' blob: mediastream:; img-src 'self' data: blob:; worker-src 'self'">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>Coffee Pub Tavern</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand"><img data-brand="icon" alt="" class="icon"><span data-brand="serverName">Coffee Pub Tavern</span></div>
    <nav class="links" id="links">
      <span id="whoami"></span>
      <a href="/me">Your image</a>
      <a href="/admin" id="admin-link" hidden>Manage</a>
      <a href="/logout">Sign out</a>
      <span class="version" data-brand="version"></span>
    </nav>
  </header>

  <div class="panel join" id="join">
    <h1 data-brand="tableName">The Table</h1>
    <div class="members" id="members"></div>
    <p class="hint">Your browser will ask for camera and microphone the first time.</p>
    <button class="btn btn-primary" id="join-button" type="button">Join</button>
    <p class="status error" id="join-error" hidden></p>
    <p class="hint install-hint" id="install-hint" hidden></p>
  </div>

  <!-- Everything at the table lives inside the stage so it can pop out as one. -->
  <main class="stage" id="stage" hidden>
    <div class="grid" id="grid"></div>

    <div class="float status-float" id="status-float">
      <span data-brand="serverName">Coffee Pub Tavern</span>
      <span class="status" id="status"></span>
    </div>

    <div class="float floatbar" id="floatbar">
      <button class="fbtn" id="mic" type="button" title="Microphone (M)" ><span class="meter" id="meter"></span><span class="glyph">&#127908;</span></button>
      <button class="fbtn" id="cam" type="button" title="Camera (V)"><span class="glyph">&#127909;</span></button>
      <button class="fbtn" id="layout" type="button" title="Layout (L): grid, strip or spotlight"><span class="glyph">&#9638;</span></button>
      <button class="fbtn" id="chat-toggle" type="button" title="Chat (C)"><span class="glyph">&#128172;</span><span class="badge" id="chat-badge" hidden></span></button>
      <button class="fbtn" id="react-toggle" type="button" title="Reactions (R, or keys 1 to 6)"><span class="glyph">&#128578;</span></button>
      <button class="fbtn" id="settings-toggle" type="button" title="Settings"><span class="glyph">&#9881;</span></button>
      <button class="fbtn" id="popout" type="button" title="Pop out into its own window" hidden><span class="glyph">&#10697;</span></button>
      <button class="fbtn danger" id="leave" type="button" title="Leave the table"><span class="glyph">&#9742;</span></button>
    </div>

    <aside class="chat" id="chat" hidden>
      <header><span>Chat</span><button class="btn btn-small" id="chat-close" type="button">Close</button></header>
      <div class="messages" id="messages"></div>
      <form id="chat-form"><input id="chat-input" type="text" maxlength="500" placeholder="Say something..." autocomplete="off"><button class="btn btn-primary btn-small" type="submit">Send</button></form>
    </aside>

    <div class="popover tray" id="react-tray" hidden>
      <button class="react" type="button" data-reaction="heart" title="Heart (1)">&#10084;&#65039;</button>
      <button class="react" type="button" data-reaction="up" title="Thumbs up (2)">&#128077;</button>
      <button class="react" type="button" data-reaction="down" title="Thumbs down (3)">&#128078;</button>
      <button class="react" type="button" data-reaction="laugh" title="Laugh (4)">&#128514;</button>
      <button class="react" type="button" data-reaction="question" title="Question (5)">&#10067;</button>
      <button class="react" type="button" data-reaction="nat20" title="Nat 20! (6)">&#127922;</button>
    </div>

    <div class="popover" id="settings" hidden>
      <h3>Audio</h3>
      <label>Microphone<select id="mic-select"></select></label>
      <label>Mic level <span class="hint" id="gain-value">100%</span><input type="range" id="gain" min="0" max="300" step="5" value="100"></label>
      <label>Noise gate <span class="hint" id="gate-value">off</span><input type="range" id="gate" min="0" max="60" step="1" value="0"></label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="noise" checked> Noise suppression</label>
        <label class="check"><input type="checkbox" id="echo" checked> Echo cancellation</label>
        <label class="check"><input type="checkbox" id="agc" checked> Auto gain</label>
      </div>
      <label>Talking<select id="talk-mode"><option value="open">Open mic</option><option value="ptt">Push to talk (hold Space)</option></select></label>
      <h3>Video</h3>
      <label>Camera<select id="cam-select"></select></label>
      <label>Quality<select id="quality"><option value="360">360p (weak connection)</option><option value="540">540p</option><option value="720" selected>720p</option></select></label>
      <label class="check"><input type="checkbox" id="mirror" checked> Mirror my own preview</label>
      <h3>Layout</h3>
      <label>Layout<select id="layout-select"><option value="grid">Grid</option><option value="strip">Strip (one row or column)</option><option value="spotlight">Spotlight (one big, rest small)</option></select></label>
      <label class="check"><input type="checkbox" id="follow-speaker" checked> Spotlight follows whoever is speaking</label>
      <p class="hint">Drag tiles to reorder them. Click a tile to spotlight it. Hover a tile for its volume.</p>
      <div class="row">
        <button class="btn btn-small" id="install" type="button" hidden>Install as an app</button>
        <span class="hint" id="install-note"></span>
      </div>
      <nav class="links">
        <a href="/me">Your image</a>
        <a href="/admin" id="admin-link-2" hidden>Manage</a>
        <a href="/logout">Sign out</a>
        <span class="version" data-brand="version"></span>
      </nav>
    </div>
  </main>

  <script type="module" src="/room.js"></script>
</body>
</html>
