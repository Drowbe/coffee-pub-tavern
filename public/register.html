<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:">
  <link rel="icon" href="/img/site/icon">
  <title>Sign up</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-head.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body data-brand="background">
  <form class="panel login" id="register">
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName">Coffee Pub</span></div>
    <p class="hint" id="invite-note" hidden></p>
    <label>Display name<input id="display-name" type="text" maxlength="40" required autocomplete="name"></label>
    <label>Username<input id="login-name" type="text" maxlength="40" required autocomplete="username" autocapitalize="off"></label>
    <label>Password<input id="password" type="password" maxlength="200" required autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Sign up</button>
    <p class="status error" id="error" hidden></p>
    <p class="hint"><a href="/login">Already have an account? Sign in</a></p>
    <span class="version" data-brand="version"></span>
  </form>
  <div class="panel login" id="closed" hidden>
    <div class="brand big"><img data-brand="icon" alt="" class="icon"><span data-brand="environmentName">Coffee Pub</span></div>
    <p class="hint" id="closed-text">Sign-up is turned off. Ask whoever runs this server for a personal link or an invite.</p>
    <p class="hint"><a href="/login">Sign in</a></p>
  </div>
  <script type="module" src="/register.js"></script>
</body>
</html>
