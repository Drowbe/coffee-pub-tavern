<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The page and every piece of markup the script clones. The script fills a clone by hooks only:
    [data-slot=name]   set its textContent (or hide it when there is no value)
    [data-icon=name]   replace its content with tavern.ui.icon(name)
  and toggles the state classes and data attributes listed in CONTRACT.md. It never builds markup with
  strings and never sets a style. The reference rendering is design/itinerary.html.
-->
<div id="app" class="app" hidden>
  <header id="trip" class="trip">
    <div>
      <h1 class="trip-title" data-slot="title"></h1>
      <div class="trip-when" data-slot="dates"></div>
    </div>
    <!-- icons with tooltips: the trip's own actions. The four views live in the toolbar (see syncHeader). -->
    <div class="tools" role="toolbar" aria-label="Trip">
      <div class="actions" role="group" aria-label="Plan">
        <button class="btn tool tool-empty" type="button" data-action="toggle-empty" title="Hide empty days" aria-label="Hide empty days" aria-pressed="false"><span class="ic" data-icon="eye-slash"></span></button>
        <button class="btn tool tool-edit" type="button" data-action="edit-trip" title="Edit trip" aria-label="Edit trip" hidden><span class="ic" data-icon="pen"></span></button>
      </div>
    </div>
    <div class="trip-facts" data-slot="summary"></div>
  </header>
  <p class="error" id="note" hidden></p>
  <div id="stripbar" class="stripbar">
    <button class="strip-arrow" type="button" data-action="strip-prev" title="Earlier days" aria-label="Earlier days"><span class="ic" data-icon="chevron-left"></span></button>
    <nav id="daystrip" class="daystrip" aria-label="Jump to a day"></nav>
    <button class="strip-arrow" type="button" data-action="strip-next" title="Later days" aria-label="Later days"><span class="ic" data-icon="chevron-right"></span></button>
  </div>
  <main id="body" class="body"></main>

  <!-- the editor: a dialog over the page. The script puts a clone of tpl-editor2 (an item) or tpl-editor-trip (the trip) in it -->
  <div id="editor" class="editor" hidden></div>

  <!-- the item menu: a popover the script positions under the button that opened it -->
  <div id="item-menu" class="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="edit"><span class="ic" data-icon="pen"></span> Edit</button>
    <button type="button" role="menuitem" data-action="earlier"><span class="ic" data-icon="arrow-up"></span> Earlier</button>
    <button type="button" role="menuitem" data-action="later"><span class="ic" data-icon="arrow-down"></span> Later</button>
    <label role="menuitem"><span class="ic" data-icon="calendar-days"></span> Move to <select id="menu-day" aria-label="Move to day"></select></label>
    <!-- for a time block only: the marker types of the settings (the script fills the list and hides this for anything else) -->
    <label role="menuitem" data-block-only hidden><span class="ic" data-icon="tag"></span> Change type <select id="menu-type" aria-label="Change type"></select></label>
    <button type="button" role="menuitem" data-action="to-ideas"><span class="ic" data-icon="lightbulb"></span> Back to ideas</button>
    <button type="button" role="menuitem" data-action="follow" hidden><span class="ic" data-icon="bell"></span> <span data-slot="follow-label">Follow its result</span></button>
    <button type="button" role="menuitem" class="danger" data-action="delete"><span class="ic" data-icon="trash"></span> <span data-slot="delete-label">Delete</span></button>
  </div>
</div>
<p id="msg" class="hint msg">Loading...</p>

<!-- ============================ templates ============================ -->

<template id="tpl-daychip"><button class="daychip" type="button" data-action="goto-day"><span data-slot="weekday"></span><b data-slot="day"></b></button></template>

<template id="tpl-day-empty"><li class="day-empty" data-slot="text"></li></template>
<template id="tpl-owner"><span class="owner"></span></template>
<template id="tpl-conflict"><div class="conflict-bar" role="alert"><span data-slot="text"></span><button class="btn" type="button" data-action="use-theirs">Use theirs</button><button class="btn" type="button" data-action="keep-mine">Keep mine</button></div></template>
<template id="tpl-suggestion"><div class="suggestion"><span class="ic" data-icon=""></span><span class="suggestion-main"><b data-slot="title"></b> · <span data-slot="module"></span></span><button class="btn" type="button" data-action="add-suggestion">Add</button></div></template>

<template id="tpl-decisions">
  <div class="section-title" data-slot="polls-title">Polls to vote on</div><ul class="decisions" data-slot="polls"></ul>
  <div class="section-title" data-slot="tasks-title">Tasks due before the trip</div><ul class="decisions" data-slot="tasks"></ul>
</template>
<template id="tpl-decision"><li class="decision"><span class="ic" data-icon=""></span><div class="decision-main"><div class="decision-title" data-slot="title"></div><div class="decision-sub" data-slot="sub"></div><span class="code" data-slot="code"></span></div><button class="btn" type="button" data-action="open"></button></li></template>

<template id="tpl-state-loading"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></template>
<template id="tpl-state-empty-trip"><div class="state" id="state-empty-trip"><h2>Plan a trip</h2><p>Give it a place and dates, and the days appear here. Anything with a date that this room's other modules hold on those days can join them.</p><p><button class="btn btn-primary" type="button" data-action="create-trip">Start planning</button></p></div></template>

<!-- ============================ the card family (see CONTRACT.md, "The card family") ============================
     A day is a header and an ol.timeline of rows. A row is li.row.entry[data-type][data-id][data-kind] holding .when (the time),
     .rail (the line and its dot) and .slot (the card). The way between two stops is li.row.leg-row. The type on the row picks the
     colour family; the card's own template picks the silhouette. The script puts the badge's icon in .badge [data-icon] from the
     type (CONTRACT.md has the table). -->
<!-- the day for the card family: the script puts a tpl-day-head clone first, then rows into ol.timeline. Same suggestions and add row as before. -->
<template id="tpl-day2"><section class="day2"><ol class="timeline"></ol><div class="suggestions" hidden><div class="suggestions-title">Other modules have</div><div class="suggestions-list"></div></div><form class="add-row"><input name="title" type="text" maxlength="200" placeholder="Add a stop, a stay or a note"><button class="btn btn-primary" type="submit" data-action="add-item" aria-label="Add"><span class="ic" data-icon="plus"></span></button></form></section></template>
<template id="tpl-day-head"><header class="day-head2"><div class="dnum"><b data-slot="daynum"></b><span data-slot="daymonth"></span></div><div class="dmeta"><h2 data-slot="position"></h2><p data-slot="summary"></p></div></header></template>
<!-- an automatic marker: the plan's first and last day (planning-start, planning-end) and its first and last booked item (trip-start, trip-end).
     Not an item: it has no id, cannot be edited, dragged or removed, and has no menu. The script sets data-marker and fills the slots. -->
<!-- DRAFT (waiting for the author on the type list): a time block, something that happens in a day and has no place: free time, rest, a buffer,
     a meet-up, a leave-by. An item a person adds (li.row.entry, data-kind="block", data-type=free-time|rest|buffer|meet-up|leave-by), drawn as a thin
     coloured band, not a card. The script fills the slots and sets data-type on the article. -->
<!-- A marker type is a label, an icon and one colour (Module Configuration > Planner > Markers): the colour gives the border, the icon
     cell and the label cell. A time block (something that happens in a day and has no place: free time, rest, a buffer, a meet-up, a leave-by)
     is an item a person adds (li.row.entry, data-kind="block") drawn as the same two-part pill. The script sets data-type on the article and,
     for a type whose colour was chosen in the settings, the custom property --marker. -->
<template id="tpl-card-block"><article class="card block markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><b data-slot="title"></b><span class="mk-len" data-slot="minutes"></span><span class="mk-note" data-slot="body"></span></span><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<template id="tpl-row-marker"><li class="row marker"><div class="when"><b data-slot="time"></b></div><div class="rail"><span class="dot"></span></div><div class="slot"><div class="markercard markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><span class="mk-date" data-slot="mdate"></span><b data-slot="title"></b><span class="sub" data-slot="sub"></span></span></div></div></li></template>
<!-- A marker between the days (the author's: some markers do not belong to a day). An item a person adds, of kind "lane", that follows a day (data-after is
     that day's date; none means before the first day). It sits on the plan's line between the day blocks, in ol.timeline.between[data-after], drawn as the same
     two-part pill with a menu. The script sets data-type, --marker, the icon and the title, as for a time block. -->
<template id="tpl-row-lane"><li class="row entry marker lane" data-kind="lane"><div class="when"><b data-slot="time"></b></div><div class="rail"><span class="dot"></span></div><div class="slot"><div class="markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><b data-slot="title"></b><span class="mk-note" data-slot="body"></span></span><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></div></div></li></template>
<!-- The joint between two days (and after the last, and before the first): a + on the line, quiet until pointed at, that opens tavern.menu.show to add a marker there. -->
<template id="tpl-joint"><div class="joint"><button class="jointadd" type="button" data-action="gap-add" aria-haspopup="menu" aria-label="Add a marker here" title="Add a marker here"><span class="ic" data-icon="plus"></span></button></div></template>
<!-- Where empty days are hidden: one badge for the run of hidden days, on the line that joins the boxes. The circle is how many days; the + opens
     the same menu (what can be added there, a marker for instance, and "Show these days"). data-from and data-to are the first and last hidden day. -->
<template id="tpl-gap"><div class="gap"><span class="gapcount" data-slot="count"></span><button class="gapadd" type="button" data-action="gap-add" aria-haspopup="menu" aria-label="Add something between these days"><span class="ic" data-icon="plus"></span></button></div></template>
<!-- adding days at either end of the plan (data-edge is before or after); the script opens the form, and the plan's start or end date moves -->
<template id="tpl-dayedge"><div class="dayedge"><button class="btn" type="button" data-action="edge-open"><span class="ic" data-icon="plus"></span> <span data-slot="label"></span></button><form class="edge-form" hidden><label>Add <input type="number" name="count" min="1" max="30" value="1" inputmode="numeric" aria-label="How many days"> <span data-slot="unit">days</span></label><button class="btn btn-primary" type="submit">Add</button><button class="btn" type="button" data-action="edge-cancel">Cancel</button></form></div></template>
<!-- shown where empty days are hidden: says how many, and shows them again -->
<template id="tpl-row"><li class="row entry"><div class="when"><b data-slot="time"></b><small data-slot="sub"></small></div><div class="rail"><span class="dot"></span></div><div class="slot"></div></li></template>
<template id="tpl-leg-row"><li class="row leg-row"><div class="when"></div><div class="rail"></div><div class="slot"><button class="leg" type="button" data-action="edit-leg"><span class="ic" data-icon=""></span><span data-slot="minutes"></span><span class="dist" data-slot="dist"></span></button></div></li></template>

<template id="tpl-card-flight"><article class="card pass"><div class="pass-main"><div class="pass-top"><span class="badge"><span class="ic" data-icon="plane"></span></span><div class="who"><span class="kicker">Flight</span><h3 data-slot="title"></h3></div></div><div class="pass-route"><div class="end"><b class="iata" data-slot="fromCode"></b><span class="city" data-slot="from"></span><span class="t" data-slot="time"></span></div><div class="path"><span class="line"></span><span class="ic" data-icon="plane"></span><span class="dur" data-slot="duration"></span></div><div class="end to"><b class="iata" data-slot="toCode"></b><span class="city" data-slot="to"></span><span class="t" data-slot="arrival"></span></div></div></div><div class="stub"><div data-slot="seat-wrap"><small>Seat</small><b data-slot="seat"></b></div><div data-slot="gate-wrap"><small>Gate</small><b data-slot="gate"></b></div><div data-slot="class-wrap"><small>Class</small><b data-slot="travelClass"></b></div><span class="bars"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-train"><article class="card ticket"><header class="strip"><span class="badge"><span class="ic" data-icon="train"></span></span><div class="who"><span class="kicker">Train</span><h3 data-slot="title"></h3></div><span class="pill" data-slot="platform"></span></header><div class="stations"><div class="st"><span class="t" data-slot="time"></span><b data-slot="from"></b></div><div class="track"><span class="ic" data-icon="train"></span></div><div class="st to"><span class="t" data-slot="arrival"></span><b data-slot="to"></b></div></div><div class="foot"><span class="pill" data-slot="seat"></span><span class="pill" data-slot="duration"></span><span class="pill mono" data-slot="confirm"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a bus, a ferry or a car (data-type on the row says which) -->
<template id="tpl-card-transit"><article class="card transit"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><div class="go"><span class="tm" data-slot="time"></span><span class="ic" data-icon="arrow-right"></span><span data-slot="to"></span><span class="pill mono" data-slot="confirm"></span></div></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-hotel"><article class="card stay"><div class="band"><span class="badge"><span class="ic" data-icon="bed"></span></span><div class="main"><span class="kicker" data-slot="kicker">Hotel</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><span class="nights" data-slot="nights"></span></div><div class="ins"><div><small>Check in</small><b data-slot="checkin"></b></div><span class="sep"></span><div><small>Check out</small><b data-slot="checkout"></b></div></div><div class="foot chips2"><span class="pill" data-slot="roomType"></span><span class="pill" data-slot="guests"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<!-- the last morning of a stay: check out (picked by span 'end') -->
<template id="tpl-card-hotel-out"><article class="card stay out"><span class="badge"><span class="ic" data-icon="door-open"></span></span><div class="main"><span class="kicker">Check out</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><div class="side"><b data-slot="time"></b><small data-slot="nights"></small></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<template id="tpl-card-hotel-mid"><article class="card stay mid"><span class="badge"><span class="ic" data-icon="bed"></span></span><h3 data-slot="title"></h3><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a meal, a coffee or a drink -->
<template id="tpl-card-meal"><article class="card meal"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="partySize"></span><span class="pill" data-slot="reservationName"></span><span class="owners" data-slot="owners"></span></div></div><div class="side"><b data-slot="time"></b><small data-slot="minutes"></small></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a sight, a museum or a tour -->
<template id="tpl-card-activity"><article class="card act"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="minutes"></span><span class="pill" data-slot="admissionCount"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a show or an event with tickets -->
<template id="tpl-card-show"><article class="card admit"><div class="admit-body"><span class="badge"><span class="ic" data-icon="masks-theater"></span></span><div><span class="kicker" data-slot="kicker">Show</span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="gate"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div></div><div class="stub"><small>Admit</small><b data-slot="admissionCount"></b><small data-slot="time"></small></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-note"><article class="card note"><span class="kicker">Note</span><h3 data-slot="title"></h3><p data-slot="body"></p></article></template>
<template id="tpl-card-place"><article class="card placecard"><span class="badge"><span class="ic" data-icon="location-dot"></span></span><div class="main"><span class="kicker">Saved place</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<template id="tpl-card-link"><article class="card linkcard"><div class="src"><span class="ic" data-icon=""></span> <span>from <span data-slot="module"></span></span><button class="open-link" type="button" data-action="open" title="Open it where it lives" aria-label="Open it where it lives"><span class="ic" data-icon="arrow-up-right-from-square"></span></button></div><h3 data-slot="title"></h3><p data-slot="sub"></p><p class="linkstate" data-slot="state" hidden></p><button class="btn" type="button" data-action="remove-link" hidden><span class="ic" data-icon="trash"></span> Remove from plan</button><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- the item editor for the card family (CONTRACT.md, "The editor"): the script replaces #form's contents with a clone of this
     when it opens the dialog and shows the fields whose data-types include the chosen type (adds .on-type). -->
<template id="tpl-editor-trip"><form class="editor-card" id="form">
    <h3 id="editor-title">Plan a trip</h3>
    <label>Title<input id="f-title" name="title" type="text" maxlength="120" required></label>
    <div class="editor-row">
      <label>Where<input id="f-destination" name="destination" type="text" maxlength="80"></label>
      <label>From<input id="f-start" name="start" type="date"></label>
      <label>To<input id="f-end" name="end" type="date"></label>
      <label>Currency<input id="f-currency" name="currency" type="text" maxlength="3" placeholder="EUR" autocapitalize="characters"></label>
    </div>
    <label>Notes<textarea id="f-notes" name="notes" rows="3" maxlength="2000"></textarea></label>
    <p class="hint" id="f-by"></p>
    <p class="error" id="f-error" hidden></p>
    <div class="editor-buttons"><button class="btn btn-primary" type="submit" id="f-save">Save</button><button class="btn" type="button" id="f-cancel">Cancel</button></div>
  </form></template>
<template id="tpl-editor2"><form class="editor-card" id="form">
    <h3 id="editor-title">Add to the plan</h3>
    <div class="typeset" id="f-types" role="group" aria-label="What is it"><div class="typegroup"><div class="typegroup-title">Getting there</div><div class="tiles"><button class="tile" type="button" data-type="flight"><span class="ic" data-icon="plane"></span><span>Flight</span></button><button class="tile" type="button" data-type="train"><span class="ic" data-icon="train"></span><span>Train</span></button><button class="tile" type="button" data-type="ferry"><span class="ic" data-icon="ship"></span><span>Ferry</span></button><button class="tile" type="button" data-type="bus"><span class="ic" data-icon="bus"></span><span>Bus</span></button><button class="tile" type="button" data-type="car"><span class="ic" data-icon="car"></span><span>Car</span></button></div></div><div class="typegroup"><div class="typegroup-title">Stay</div><div class="tiles"><button class="tile" type="button" data-type="hotel"><span class="ic" data-icon="bed"></span><span>Stay</span></button></div></div><div class="typegroup"><div class="typegroup-title">Eat and drink</div><div class="tiles"><button class="tile" type="button" data-type="restaurant"><span class="ic" data-icon="utensils"></span><span>Restaurant</span></button><button class="tile" type="button" data-type="cafe"><span class="ic" data-icon="mug-hot"></span><span>Café</span></button><button class="tile" type="button" data-type="bar"><span class="ic" data-icon="martini-glass"></span><span>Bar</span></button></div></div><div class="typegroup"><div class="typegroup-title">See and do</div><div class="tiles"><button class="tile" type="button" data-type="sight"><span class="ic" data-icon="monument"></span><span>Sight</span></button><button class="tile" type="button" data-type="museum"><span class="ic" data-icon="building-columns"></span><span>Museum</span></button><button class="tile" type="button" data-type="tour"><span class="ic" data-icon="person-hiking"></span><span>Tour</span></button><button class="tile" type="button" data-type="show"><span class="ic" data-icon="masks-theater"></span><span>Show</span></button></div></div><div class="typegroup"><div class="typegroup-title">Other</div><div class="tiles"><button class="tile" type="button" data-type="note"><span class="ic" data-icon="note-sticky"></span><span>Note</span></button></div></div></div>
    <label>Title<input id="f-title" name="title" type="text" maxlength="120" required></label>
    <div class="editor-row"><label>Day<select id="f-date" name="date"></select></label>
      <label data-types="block flight train ferry bus car restaurant cafe bar sight museum tour show hotel"><span id="f-time-label">Time</span><input id="f-time" name="time" type="time"></label>
      <label data-types="block flight train ferry bus car restaurant cafe bar sight museum tour show">Length (minutes)<input id="f-minutes" name="minutes" type="number" min="0" step="5"></label>
      <label data-types="hotel">Check out<select id="f-checkout" name="checkOut"></select></label>
      <label data-types="hotel">Check-out time<input id="f-checkOutTime" name="checkOutTime" type="time"></label></div>

    <div class="fieldgroup" data-types="flight train ferry bus car"><div class="fieldgroup-title">Journey</div>
      <div class="editor-row"><label data-types="flight train ferry bus car">Airline or operator<input id="f-operator" name="operator" type="text" maxlength="80"></label><label data-types="flight train ferry bus">Number<input id="f-number" name="number" type="text" maxlength="20"></label></div>
      <div class="pairing" data-types="flight"><label class="codebox">From (code)<input id="f-fromCode" name="fromCode" maxlength="5"></label><span class="arrow"><span class="ic" data-icon="arrow-right"></span></span><label class="codebox">To (code)<input id="f-toCode" name="toCode" maxlength="5"></label></div>
      <div class="pairing" data-types="flight train ferry bus"><label>From<input id="f-from" name="from" maxlength="120"></label><span class="arrow"><span class="ic" data-icon="arrow-right"></span></span><label>To<input id="f-to" name="to" maxlength="120"></label></div>
      <div class="pairing" data-types="car"><label>Pick up<input id="f-pickup" name="pickup" maxlength="120"></label><span class="arrow"><span class="ic" data-icon="arrow-right"></span></span><label>Drop off<input id="f-dropoff" name="dropoff" maxlength="120"></label></div>
