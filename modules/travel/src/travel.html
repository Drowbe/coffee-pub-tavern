<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The page and every piece of markup the script clones. The script fills a clone by hooks only:
    [data-slot=name]   set its textContent (or hide it when there is no value)
    [data-icon=name]   replace its content with tavern.ui.icon(name)
  and toggles the state classes and data attributes listed in CONTRACT.md. It never builds markup with
  strings and never sets a style. The reference rendering is design/itinerary.html.
-->
<div id="app" class="app" hidden>
  <header id="trip" class="trip">
    <div>
      <h1 class="trip-title" data-slot="title"></h1>
      <div class="trip-when" data-slot="dates"></div>
    </div>
    <div class="views" role="group" aria-label="View">
      <button class="btn on" type="button" data-view="days">Days</button>
      <button class="btn" type="button" data-view="decisions">Decisions<span class="count" data-slot="decisions-count" hidden></span></button>
      <button class="btn" type="button" data-view="bookings">Bookings</button>
      <button class="btn" type="button" data-view="money">Money</button>
    </div>
    <div class="trip-facts" data-slot="summary"></div>
    <button class="btn" type="button" data-action="edit-trip" hidden>Edit trip</button>
  </header>
  <p class="error" id="note" hidden></p>
  <nav id="daystrip" class="daystrip" aria-label="Jump to a day"></nav>
  <main id="body" class="body"></main>

  <!-- the item and trip editor: a dialog over the page. The script shows the fields a kind needs (data-kinds lists them) -->
  <div id="editor" class="editor" hidden>
    <form id="form" class="editor-card">
      <h3 id="editor-title">Add to the plan</h3>
      <div class="kindtabs" id="f-kinds" role="group" aria-label="What is it">
        <button class="btn on" type="button" data-kind="stop">Stop</button>
        <button class="btn" type="button" data-kind="stay">Stay</button>
        <button class="btn" type="button" data-kind="journey">Journey</button>
        <button class="btn" type="button" data-kind="note">Note</button>
      </div>
      <label>Title<input id="f-title" name="title" type="text" maxlength="200" required></label>
      <div class="editor-row" data-kinds="trip">
        <label>Where<input id="f-destination" name="destination" type="text" maxlength="80"></label>
        <label>From<input id="f-start" name="start" type="date"></label>
        <label>To<input id="f-end" name="end" type="date"></label>
        <label>Currency<input id="f-currency" name="currency" type="text" maxlength="3" placeholder="EUR" autocapitalize="characters"></label>
      </div>
      <div class="editor-row" data-kinds="stop stay journey note">
        <label>Day<select id="f-date" name="date"></select></label>
        <label data-kinds="stop journey stay">Time<input id="f-time" name="time" type="time"></label>
        <label data-kinds="stop">Length (minutes)<input id="f-minutes" name="minutes" type="number" min="0" step="5"></label>
        <label data-kinds="stay">Check out<select id="f-checkout" name="checkOut"></select></label>
      </div>
      <div class="editor-row" data-kinds="journey">
        <label>From<input id="f-from" name="from" type="text" maxlength="120"></label>
        <label>To<input id="f-to" name="to" type="text" maxlength="120"></label>
      </div>
      <div class="editor-row" data-kinds="stop stay">
        <label>Category<select id="f-category" name="category"><option value="do">Things to do</option><option value="eat">Food</option><option value="stay">Stay</option><option value="travel">Travel</option><option value="other">Other</option></select></label>
        <label>Place<input id="f-place" name="place" type="text" maxlength="200"></label>
      </div>
      <label data-kinds="stop stay">Address<input id="f-address" name="address" type="text" maxlength="300"></label>
      <div class="editor-row" data-kinds="stop stay journey">
        <label>Cost<input id="f-cost" name="cost" type="number" min="0" step="0.01" inputmode="decimal"></label>
        <label>Paid by<select id="f-paidby" name="paidBy"></select></label>
      </div>
      <label data-kinds="stay journey">Booking reference<input id="f-confirm" name="confirm" type="text" maxlength="80"></label>
      <label>Notes<textarea id="f-notes" name="notes" rows="3" maxlength="2000"></textarea></label>
      <div data-kinds="stop stay journey note">
        <div class="hint">Whose is it (they share its cost; everyone does when nobody is ticked)</div>
        <div class="editor-people" id="f-owners"></div>
      </div>
      <label class="check" data-kinds="stop stay journey note"><input id="f-done" name="done" type="checkbox"> Done</label>
      <p class="hint" id="f-by"></p>
      <p class="error" id="f-error" hidden></p>
      <div class="editor-buttons">
        <button class="btn btn-primary" type="submit" id="f-save">Save</button>
        <button class="btn" type="button" id="f-cancel">Cancel</button>
        <span class="grow"></span>
        <button class="btn btn-danger" type="button" id="f-delete" hidden>Delete</button>
      </div>
    </form>
  </div>

  <!-- the item menu: a popover the script positions under the button that opened it -->
  <div id="item-menu" class="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="edit"><span class="ic" data-icon="pen"></span> Edit</button>
    <button type="button" role="menuitem" data-action="earlier"><span class="ic" data-icon="arrow-up"></span> Earlier</button>
    <button type="button" role="menuitem" data-action="later"><span class="ic" data-icon="arrow-down"></span> Later</button>
    <label role="menuitem"><span class="ic" data-icon="calendar-days"></span> Move to <select id="menu-day" aria-label="Move to day"></select></label>
    <button type="button" role="menuitem" data-action="to-ideas"><span class="ic" data-icon="lightbulb"></span> Back to ideas</button>
    <button type="button" role="menuitem" data-action="follow" hidden><span class="ic" data-icon="bell"></span> <span data-slot="follow-label">Follow its result</span></button>
    <button type="button" role="menuitem" class="danger" data-action="delete"><span class="ic" data-icon="trash"></span> Delete</button>
  </div>
</div>
<p id="msg" class="hint msg">Loading...</p>

<!-- ============================ templates ============================ -->

<template id="tpl-daychip"><button class="daychip" type="button" data-action="goto-day"><span data-slot="weekday"></span><b data-slot="day"></b></button></template>

<template id="tpl-day">
  <section class="day">
    <header class="day-head"><span class="day-date" data-slot="date"></span><span class="day-of" data-slot="position"></span><span class="day-count" data-slot="count"></span></header>
    <ol class="items"></ol>
    <div class="suggestions" hidden><div class="suggestions-title">Other modules have</div><div class="suggestions-list"></div></div>
    <form class="add-row"><input name="title" type="text" maxlength="200" placeholder="Add a stop, a stay or a note"><button class="btn btn-primary" type="submit" data-action="add-item" aria-label="Add"><span class="ic" data-icon="plus"></span></button></form>
  </section>
</template>
<template id="tpl-day-empty"><li class="day-empty" data-slot="text"></li></template>

<!-- an item: the chrome is the same for every kind; the body differs. The item element gets data-id, data-kind,
     data-cat (a stop, a stay, a note), data-span (a stay) and the classes done / conflict / dragging. -->
<template id="tpl-item-stop">
  <li class="item">
    <button class="item-handle" type="button" data-action="drag" aria-label="Drag to move"><span class="ic" data-icon="grip-vertical"></span></button>
    <div class="item-time" data-slot="time"></div>
    <div class="item-main">
      <h3 class="item-title" data-slot="title"></h3>
      <p class="item-sub" data-slot="place"><span class="ic" data-icon="location-dot"></span> <span data-slot="place-text"></span></p>
      <div class="item-meta"><span class="cat" data-slot="category"><span class="ic" data-icon=""></span> <span data-slot="category-label"></span></span><span class="owners" data-slot="owners"></span><span class="links" data-slot="links"></span></div>
    </div>
    <button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button>
  </li>
</template>
<template id="tpl-item-stay">
  <li class="item">
    <button class="item-handle" type="button" data-action="drag" aria-label="Drag to move"><span class="ic" data-icon="grip-vertical"></span></button>
    <div class="item-time" data-slot="time"></div>
    <div class="item-main">
      <h3 class="item-title" data-slot="title"></h3>
      <p class="item-sub" data-slot="place"><span class="ic" data-icon="location-dot"></span> <span data-slot="place-text"></span></p>
      <div class="item-meta"><span class="cat cat-stay" data-slot="category"><span class="ic" data-icon="bed"></span> Stay</span><span class="code" data-slot="code"></span><span class="owners" data-slot="owners"></span></div>
    </div>
    <button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button>
  </li>
</template>
<template id="tpl-item-journey">
  <li class="item">
    <button class="item-handle" type="button" data-action="drag" aria-label="Drag to move"><span class="ic" data-icon="grip-vertical"></span></button>
    <div class="item-time" data-slot="time"></div>
    <div class="item-main">
      <h3 class="item-title" data-slot="title"></h3>
      <div class="route"><span data-slot="from"></span><span class="ic" data-icon="arrow-right"></span><span data-slot="to"></span></div>
      <div class="item-meta"><span class="cat cat-travel" data-slot="category"><span class="ic" data-icon="plane"></span> Travel</span><span class="code" data-slot="code"></span><span class="owners" data-slot="owners"></span></div>
    </div>
    <button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button>
  </li>
</template>
<template id="tpl-item-note">
  <li class="item">
    <button class="item-handle" type="button" data-action="drag" aria-label="Drag to move"><span class="ic" data-icon="grip-vertical"></span></button>
    <div class="item-time" data-slot="time"></div>
    <div class="item-main">
      <h3 class="item-title" data-slot="title"></h3>
      <p class="item-sub" data-slot="body"></p>
      <div class="item-meta"><span class="cat cat-other" data-slot="category"><span class="ic" data-icon="note-sticky"></span> Other</span><span class="owners" data-slot="owners"></span></div>
    </div>
    <button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button>
  </li>
</template>
<!-- a link item: another module's item, drawn from its card (data-kind="link") -->
<template id="tpl-item-link">
  <li class="item">
    <button class="item-handle" type="button" data-action="drag" aria-label="Drag to move"><span class="ic" data-icon="grip-vertical"></span></button>
    <div class="item-time" data-slot="time"></div>
    <div class="item-main">
      <div class="source" data-slot="source"><span class="ic" data-icon=""></span> <span>from <span data-slot="module"></span></span><button class="open" type="button" data-action="open">Open</button></div>
      <h3 class="item-title" data-slot="title"></h3>
      <p class="item-sub" data-slot="body"></p>
      <div class="item-meta"><span class="owners" data-slot="owners"></span></div>
    </div>
    <button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button>
  </li>
</template>

<template id="tpl-owner"><span class="owner"></span></template>
<template id="tpl-link"><span class="link"><span class="ic" data-icon=""></span> <b data-slot="kind"></b> <span data-slot="title"></span></span></template>
<template id="tpl-gap"><li class="gap" data-slot="gap" aria-hidden="true"></li></template>
<template id="tpl-conflict"><div class="conflict-bar" role="alert"><span data-slot="text"></span><button class="btn" type="button" data-action="use-theirs">Use theirs</button><button class="btn" type="button" data-action="keep-mine">Keep mine</button></div></template>
<template id="tpl-suggestion"><div class="suggestion"><span class="ic" data-icon=""></span><span class="suggestion-main"><b data-slot="title"></b> · <span data-slot="module"></span></span><button class="btn" type="button" data-action="add-suggestion">Add</button></div></template>

<template id="tpl-decisions">
  <div class="section-title" data-slot="polls-title">Polls to vote on</div><ul class="decisions" data-slot="polls"></ul>
  <div class="section-title" data-slot="tasks-title">Tasks due before the trip</div><ul class="decisions" data-slot="tasks"></ul>
</template>
<template id="tpl-decision"><li class="decision"><span class="ic" data-icon=""></span><div class="decision-main"><div class="decision-title" data-slot="title"></div><div class="decision-sub" data-slot="sub"></div><span class="code" data-slot="code"></span></div><button class="btn" type="button" data-action="open"></button></li></template>

<template id="tpl-state-loading"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></template>
<template id="tpl-state-empty-trip"><div class="state" id="state-empty-trip"><h2>Plan a trip</h2><p>Give it a place and dates, and the days appear here. Anything with a date that this room's other modules hold on those days can join them.</p><p><button class="btn btn-primary" type="button" data-action="create-trip">Start planning</button></p></div></template>

<!-- ============================ the card family (see CONTRACT.md, "The card family") ============================
     A day is a header and an ol.timeline of rows. A row is li.row.entry[data-type][data-id][data-kind] holding .when (the time),
     .rail (the line and its dot) and .slot (the card). The way between two stops is li.row.leg-row. The type on the row picks the
     colour family; the card's own template picks the silhouette. The script puts the badge's icon in .badge [data-icon] from the
     type (CONTRACT.md has the table). -->
<!-- the day for the card family: the script puts a tpl-day-head clone first, then rows into ol.timeline. Same suggestions and add row as before. -->
<template id="tpl-day2"><section class="day2"><ol class="timeline"></ol><div class="suggestions" hidden><div class="suggestions-title">Other modules have</div><div class="suggestions-list"></div></div><form class="add-row"><input name="title" type="text" maxlength="200" placeholder="Add a stop, a stay or a note"><button class="btn btn-primary" type="submit" data-action="add-item" aria-label="Add"><span class="ic" data-icon="plus"></span></button></form></section></template>
<template id="tpl-day-head"><header class="day-head2"><div class="dnum"><b data-slot="daynum"></b><span data-slot="daymonth"></span></div><div class="dmeta"><h2 data-slot="position"></h2><p data-slot="summary"></p></div></header></template>
<template id="tpl-row"><li class="row entry"><div class="when"><b data-slot="time"></b><small data-slot="sub"></small></div><div class="rail"><span class="dot"></span></div><div class="slot"></div></li></template>
<template id="tpl-leg-row"><li class="row leg-row"><div class="when"></div><div class="rail"></div><div class="slot"><button class="leg" type="button" data-action="edit-leg"><span class="ic" data-icon=""></span><span data-slot="minutes"></span><span class="dist" data-slot="dist"></span></button></div></li></template>

<template id="tpl-card-flight"><article class="card pass"><div class="pass-main"><div class="pass-top"><span class="badge"><span class="ic" data-icon="plane"></span></span><div class="who"><span class="kicker">Flight</span><h3 data-slot="title"></h3></div></div><div class="pass-route"><div class="end"><b class="iata" data-slot="fromCode"></b><span class="city" data-slot="from"></span><span class="t" data-slot="time"></span></div><div class="path"><span class="line"></span><span class="ic" data-icon="plane"></span><span class="dur" data-slot="duration"></span></div><div class="end to"><b class="iata" data-slot="toCode"></b><span class="city" data-slot="to"></span><span class="t" data-slot="arrival"></span></div></div></div><div class="stub"><div data-slot="seat-wrap"><small>Seat</small><b data-slot="seat"></b></div><div data-slot="gate-wrap"><small>Gate</small><b data-slot="gate"></b></div><div data-slot="class-wrap"><small>Class</small><b data-slot="travelClass"></b></div><span class="bars"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-train"><article class="card ticket"><header class="strip"><span class="badge"><span class="ic" data-icon="train"></span></span><div class="who"><span class="kicker">Train</span><h3 data-slot="title"></h3></div><span class="pill" data-slot="platform"></span></header><div class="stations"><div class="st"><span class="t" data-slot="time"></span><b data-slot="from"></b></div><div class="track"><span class="ic" data-icon="train"></span></div><div class="st to"><span class="t" data-slot="arrival"></span><b data-slot="to"></b></div></div><div class="foot"><span class="pill" data-slot="seat"></span><span class="pill" data-slot="duration"></span><span class="pill mono" data-slot="confirm"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a bus, a ferry or a car (data-type on the row says which) -->
<template id="tpl-card-transit"><article class="card transit"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><div class="go"><span class="tm" data-slot="time"></span><span class="ic" data-icon="arrow-right"></span><span data-slot="to"></span><span class="pill mono" data-slot="confirm"></span></div></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-hotel"><article class="card stay"><div class="band"><span class="badge"><span class="ic" data-icon="bed"></span></span><div class="main"><span class="kicker" data-slot="kicker">Hotel</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><span class="nights" data-slot="nights"></span></div><div class="ins"><div><small>Check in</small><b data-slot="checkin"></b></div><span class="sep"></span><div><small>Check out</small><b data-slot="checkout"></b></div></div><div class="foot chips2"><span class="pill" data-slot="roomType"></span><span class="pill" data-slot="guests"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<template id="tpl-card-hotel-mid"><article class="card stay mid"><span class="badge"><span class="ic" data-icon="bed"></span></span><h3 data-slot="title"></h3><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a meal, a coffee or a drink -->
<template id="tpl-card-meal"><article class="card meal"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="partySize"></span><span class="pill" data-slot="reservationName"></span><span class="owners" data-slot="owners"></span></div></div><div class="side"><b data-slot="time"></b><small data-slot="minutes"></small></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a sight, a museum or a tour -->
<template id="tpl-card-activity"><article class="card act"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="minutes"></span><span class="pill" data-slot="admissionCount"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<!-- a show or an event with tickets -->
<template id="tpl-card-show"><article class="card admit"><div class="admit-body"><span class="badge"><span class="ic" data-icon="masks-theater"></span></span><div><span class="kicker" data-slot="kicker">Show</span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="gate"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div></div><div class="stub"><small>Admit</small><b data-slot="admissionCount"></b><small data-slot="time"></small></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<template id="tpl-card-note"><article class="card note"><span class="kicker">Note</span><h3 data-slot="title"></h3><p data-slot="body"></p></article></template>
<template id="tpl-card-place"><article class="card placecard"><span class="badge"><span class="ic" data-icon="location-dot"></span></span><div class="main"><span class="kicker">Saved place</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>
<template id="tpl-card-link"><article class="card linkcard"><div class="src"><span class="ic" data-icon=""></span> <span>from <span data-slot="module"></span></span><button class="open" type="button" data-action="open">Open</button></div><h3 data-slot="title"></h3><p data-slot="sub"></p><button class="menu-btn" type="button" data-action="move-menu" aria-label="Item menu"><span class="ic" data-icon="ellipsis"></span></button></article></template>

<script>
/*__JS__*/
</script>
</body>
</html>
