<title>Travel: itinerary design mock</title>
<!--
  A static design mock of the Travel module's itinerary, for agreeing the markup (see ../src/CONTRACT.md).
  Open this file in a browser. The page draws a small harness (state, theme and size) around an iframe of
  itself, so the phone layout is a real 390px viewport. The real module gets the theme from the SDK; here the
  tokens come from ../../../public/sdk/tavern.css and a light palette is a class on <html>.
  render() below is the reference for the markup: a script that builds the same elements and toggles the same
  classes and attributes will look exactly like this. Icons are inline SVG from Font Awesome Free (CC BY 4.0).
-->
<link rel="stylesheet" href="../../../public/sdk/tavern.css">

<style>
/* the harness and the light palette are only for this mock */
html.light { --bg:#f4f1ec; --bg-section:#ffffff; --bg-card:#f6f2ea; --bg-input:#ffffff; --border:#d6cfc4; --text:#2a2118; --text-dim:#6f6558; --accent:#b8702a; --on-accent:#ffffff; --danger:#c0392b; }
body.harness { display: block; overflow: auto; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.harness-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.harness-bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-dim); }
.harness-frame { display: block; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
</style>
</head>

<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
if (theme === 'light') document.documentElement.classList.add('light');

// ---------------------------------------------------------------- the harness
if (!q.has('bare')) {
  document.body.className = 'harness';
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="harness-bar">
      ${opt('state', ['normal', 'decisions', 'empty-trip', 'empty-day', 'loading', 'conflict', 'busy-day', 'dragging'], state)}
      ${opt('theme', ['dark', 'light'], theme)}
      ${opt('size', ['phone', 'pane', 'wide'], size)}
      <span class="hint">phone 390 wide, pane 560 (a docked module), wide 1100</span>
    </div>`);
  const w = { phone: 390, pane: 560, wide: 1100 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 640}px`;
  f.src = `itinerary.html?bare=1&state=${state}&theme=${theme}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
  }));
} else {
  // ------------------------------------------------------------ the module page
  const ic = (name) => `<span class="ic" data-icon="${name}"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
  const people = ['Thomas', 'Christy', 'Cliff', 'Alicia', 'Mark'];
  const owners = (names) => names.length ? `<span class="owners" data-slot="owners" title="${names.join(', ')}">${names.map((n) => `<span class="owner">${n[0]}</span>`).join('')}</span>` : '';
  const links = (list) => list.length ? `<span class="links" data-slot="links">${list.map((l) => `<span class="link${l.gone ? ' gone' : ''}">${ic(l.icon)} <b>${l.kind}</b> ${l.title}</span>`).join('')}</span>` : '';
  const CATS = { things: ['landmark', 'Things to do'], food: ['utensils', 'Food'], stay: ['bed', 'Stay'], travel: ['plane', 'Travel'], other: ['note-sticky', 'Other'] };
  const cat = (c) => `<span class="cat cat-${c}" data-slot="category">${ic(CATS[c][0])} ${CATS[c][1]}</span>`;
  const time = (a, b) => `<div class="item-time" data-slot="time">${a ? `<b>${a}</b>${b || ''}` : '<span title="No time">any</span>'}</div>`;
  const chrome = (id) => ({
    handle: `<button class="item-handle" type="button" data-action="drag" aria-label="Drag to move">${ic('grip-vertical')}</button>`,
    menu: `<button class="item-menu" type="button" data-action="move-menu" aria-label="Item menu">${ic('ellipsis')}</button>`,
  });
  const wrap = (it, inner) => {
    const c = chrome();
    const cls = ['item', it.done ? 'done' : '', it.conflict ? 'conflict' : '', it.dragging ? 'dragging' : ''].filter(Boolean).join(' ');
    const attrs = `data-id="${it.id}" data-kind="${it.kind}"${it.cat ? ` data-cat="${it.cat}"` : ''}${it.span ? ` data-span="${it.span}"` : ''}${it.drop ? ` data-drop="${it.drop}"` : ''}`;
    const conflict = it.conflict ? `<div class="conflict-bar" role="alert"><span>${it.conflict} changed this while you were editing.</span><button class="btn" type="button" data-action="use-theirs">Use theirs</button><button class="btn" type="button" data-action="keep-mine">Keep mine</button></div>` : '';
    return `<li class="${cls}" ${attrs}>${c.handle}${inner}${c.menu}${conflict}</li>`;
  };
  const stop = (it) => wrap(it, `${time(it.at, it.len)}<div class="item-main"><h3 class="item-title" data-slot="title">${it.title}</h3>${it.place ? `<p class="item-sub" data-slot="place">${ic('location-dot')} ${it.place}</p>` : ''}<div class="item-meta">${cat(it.cat)}${owners(it.owners || [])}${links(it.links || [])}</div></div>`);
  const stay = (it) => wrap(it, `${it.span === 'middle' ? '<div class="item-time" data-slot="time"></div>' : time(it.at, { start: 'check in', end: 'check out' }[it.span])}<div class="item-main"><h3 class="item-title" data-slot="title">${{ start: '', middle: 'Staying at ', end: '' }[it.span]}${it.title}</h3>${it.place ? `<p class="item-sub" data-slot="place">${ic('location-dot')} ${it.place}</p>` : ''}<div class="item-meta">${cat('stay')}${it.code ? `<span class="code" data-slot="code">${it.code}</span>` : ''}${owners(it.owners || [])}</div></div>`);
  const journey = (it) => wrap(it, `${time(it.at, it.arr ? `→ ${it.arr}` : '')}<div class="item-main"><h3 class="item-title" data-slot="title">${it.title}</h3><div class="route"><span data-slot="from">${it.from}</span>${ic('arrow-right')}<span data-slot="to">${it.to}</span></div><div class="item-meta">${cat('travel')}${it.code ? `<span class="code" data-slot="code">${it.code}</span>` : ''}${owners(it.owners || [])}</div></div>`);
  const note = (it) => wrap(it, `${time('', '')}<div class="item-main"><h3 class="item-title" data-slot="title">${it.title}</h3>${it.body ? `<p class="item-sub" data-slot="body">${it.body}</p>` : ''}<div class="item-meta">${cat('other')}${owners(it.owners || [])}</div></div>`);
  const ref = (it) => wrap(it, `${time(it.at, it.end)}<div class="item-main"><div class="source" data-slot="source">${ic(it.module.icon)} from ${it.module.name}<button class="open" type="button" data-action="open">Open</button></div><h3 class="item-title" data-slot="title">${it.title}</h3>${it.sub ? `<p class="item-sub" data-slot="body">${it.sub}</p>` : ''}${it.owners ? `<div class="item-meta">${owners(it.owners)}</div>` : ''}</div>`);
  const item = (it) => ({ stop, stay, journey, note, ref })[it.kind](it);
  const gap = (t) => `<li class="gap" data-slot="gap" aria-hidden="true">${t}</li>`;

  const CAL = { name: 'Calendar', icon: 'calendar-days' }, TODO = { name: 'To-do', icon: 'list-check' }, POLL = { name: 'Polls', icon: 'square-poll-vertical' };
  const D = [
    { date: '2026-10-03', label: 'Sat 3 Oct', items: [
      { id: 'a1', kind: 'journey', title: 'Flight to Lisbon', from: 'Denver DEN', to: 'Lisbon LIS', at: '17:40', arr: '10:05 +1', code: 'TP 214 · X7K2QP', owners: people },
      { id: 'a2', kind: 'note', title: 'Pack plug adapters', body: 'Portugal uses type F, 230 V.', owners: ['Cliff'] } ] },
    { date: '2026-10-04', label: 'Sun 4 Oct', items: [
      { id: 'b1', kind: 'stop', cat: 'food', title: 'Lunch at Time Out Market', place: 'Av. 24 de Julho 49', at: '13:00', len: '1 h 30', owners: ['Alicia', 'Mark'] },
      { id: 'b2', kind: 'stay', span: 'start', title: 'Hotel Avenida Palace', place: 'Rua 1º de Dezembro 101', at: '15:00', code: 'BK-88213', owners: ['Thomas'] },
      { id: 'b3', kind: 'ref', module: CAL, title: 'Dinner: Cervejaria Ramiro', sub: 'Table for 5', at: '20:00', end: '22:00', owners: people } ] },
    { date: '2026-10-05', label: 'Mon 5 Oct', today: true, items: [
      { id: 'c0', kind: 'stay', span: 'middle', title: 'Hotel Avenida Palace', at: '' },
      { id: 'c1', kind: 'stop', cat: 'things', title: 'Belém Tower', place: 'Av. Brasília', at: '09:30', len: '1 h 30', owners: ['Thomas', 'Christy'], links: [{ icon: 'square-poll-vertical', kind: 'Poll', title: 'Tower or Monastery first?' }] },
      { id: 'c1g', gap: '45 min walk' },
      { id: 'c2', kind: 'stop', cat: 'things', title: 'Jerónimos Monastery', place: 'Praça do Império', at: '11:30', len: '2 h', links: [{ icon: 'list-check', kind: 'Task', title: 'Book timed tickets' }] },
      { id: 'c3', kind: 'ref', module: TODO, title: 'Buy tram 28 day passes', at: '', owners: ['Cliff'] },
      { id: 'c4', kind: 'ref', module: POLL, title: 'Where do we eat tonight?', sub: 'Closes at 18:00 · 3 of 5 have voted', at: '18:00', owners: [] },
      { id: 'c5', kind: 'stop', cat: 'other', title: 'Sunset at Miradouro da Senhora do Monte', at: '19:30', owners: [] } ] },
    { date: '2026-10-06', label: 'Tue 6 Oct', items: [ { id: 'd1', kind: 'stay', span: 'middle', title: 'Hotel Avenida Palace', at: '' }, { id: 'd2', kind: 'journey', title: 'Day trip to Sintra', from: 'Rossio', to: 'Sintra', at: '09:12', arr: '09:52', code: 'CP 15102', owners: people } ] },
    { date: '2026-10-07', label: 'Wed 7 Oct', items: [] },
    { date: '2026-10-08', label: 'Thu 8 Oct', items: [ { id: 'f1', kind: 'stay', span: 'middle', title: 'Hotel Avenida Palace', at: '' }, { id: 'f2', kind: 'stop', cat: 'food', title: 'Farewell dinner', at: '20:30', owners: people } ] },
    { date: '2026-10-09', label: 'Fri 9 Oct', items: [ { id: 'g1', kind: 'stay', span: 'end', title: 'Hotel Avenida Palace', at: '11:00' }, { id: 'g2', kind: 'journey', title: 'Flight home', from: 'Lisbon LIS', to: 'Denver DEN', at: '14:20', arr: '17:50', code: 'TP 213 · X7K2QP', owners: people } ] },
  ];
  if (state === 'busy-day') {
    const many = []; const names = ['Coffee at A Brasileira', 'Elevador de Santa Justa', 'Carmo Convent', 'Rossio Square', 'Lunch: bifana', 'LX Factory', 'Ponte 25 de Abril view', 'Pastéis de Belém', 'MAAT museum', 'Tile Museum', 'Fado at Alfama', 'Late snack'];
    for (let i = 0; i < 20; i += 1) many.push({ id: `x${i}`, kind: 'stop', cat: ['things', 'food', 'other'][i % 3], title: `${names[i % names.length]} ${i >= names.length ? '(2)' : ''}`, at: `${String(8 + Math.floor(i / 2)).padStart(2, '0')}:${i % 2 ? '30' : '00'}`, owners: i % 4 ? [] : ['Mark'] });
    D[3].items = many;
  }
  if (state === 'empty-day') D[2].items = [];
  if (state === 'conflict') D[2].items[1].conflict = 'Christy';
  if (state === 'dragging') { D[2].items[1].dragging = true; D[2].items[3].drop = 'before'; D[3].drop = 'into'; }

  const day = (d, i) => {
    const list = d.items.map((it) => (it.gap ? gap(it.gap) : item(it))).join('');
    return `<section class="day${d.today ? ' today' : ''}${d.drop ? ' drop-target' : ''}" id="day-${d.date}" data-day="${d.date}" data-index="${i + 1}">
      <header class="day-head"><span class="day-date" data-slot="date">${d.label}</span><span class="day-of">day ${i + 1} of ${D.length}</span><span class="day-count">${d.items.filter((x) => !x.gap).length || ''}</span></header>
      <ol class="items">${list || '<li class="day-empty">Nothing planned yet. Add something below, or drag it here.</li>'}</ol>
      <form class="add-row" data-day="${d.date}"><input name="title" type="text" maxlength="200" placeholder="Add a stop, a stay or a note" aria-label="Add to ${d.label}"><button class="btn btn-primary" type="submit" data-action="add-item" aria-label="Add">${ic('plus')}</button></form>
    </section>`;
  };
  const strip = () => D.map((d, i) => `<button class="daychip${d.today ? ' today current' : ''}" type="button" data-action="goto-day" data-day="${d.date}">${d.label.split(' ')[0]}<b>${d.label.split(' ')[1]}</b></button>`).join('');
  const header = (view) => `<header class="trip" id="trip">
      <div><h1 class="trip-title" data-slot="title">Lisbon</h1><div class="trip-when" data-slot="dates">Sat 3 – Fri 9 Oct 2026</div></div>
      <div class="views" role="group" aria-label="View"><button class="btn${view === 'days' ? ' on' : ''}" type="button" data-view="days">Days</button><button class="btn${view === 'decisions' ? ' on' : ''}" type="button" data-view="decisions">Decisions<span class="count">3</span></button><button class="btn" type="button" data-view="bookings">Bookings</button></div>
      <div class="trip-facts" data-slot="summary"><span><b>7</b> days</span><span><b>5</b> travellers</span><span><b>3</b> open decisions</span></div>
    </header>`;
  const decision = (icn, title, sub, btn) => `<li class="decision"><span class="ic" data-icon="${icn}">${ic(icn)}</span><div class="decision-main"><div class="decision-title">${title}</div><div class="decision-sub">${sub}</div></div><button class="btn" type="button" data-action="open">${btn}</button></li>`;
  const decisions = () => `<div class="section-title">Polls to vote on</div><ul class="decisions" id="decisions">${decision('square-poll-vertical', 'Where do we eat tonight?', 'Closes Mon 5 Oct, 18:00 · 3 of 5 voted', 'Vote')}${decision('square-poll-vertical', 'Tower or Monastery first?', 'Closed · winner: Tower · on Mon 5 Oct', 'Open')}</ul><div class="section-title">Tasks due before the trip</div><ul class="decisions">${decision('list-check', 'Book timed tickets for Jerónimos', 'Due Fri 2 Oct · Cliff', 'Open')}</ul>`;

  let html;
  const view = state === 'decisions' ? 'decisions' : 'days';
  if (state === 'loading') {
    html = `<div class="app" id="app">${header('days')}<div class="body"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div></div>`;
  } else if (state === 'empty-trip') {
    html = `<div class="app" id="app"><div class="body"><div class="state" id="state-empty-trip"><h2>Plan a trip</h2><p>Give it a place and dates, and the days appear here. Anything with a date in Calendar, To-do or Polls joins them.</p><p><button class="btn btn-primary" type="button" data-action="create-trip">Start planning</button></p></div></div></div>`;
  } else {
    html = `<div class="app" id="app">${header(view)}${view === 'days' ? `<nav class="daystrip" id="daystrip" aria-label="Jump to a day">${strip()}</nav>` : ''}<div class="body" id="body">${view === 'days' ? `<div class="days" id="days">${D.map(day).join('')}</div>` : decisions()}</div></div>`;
  }
  document.body.insertAdjacentHTML('beforeend', html);
  // today's column/section in view (the script does this on load)
  document.getElementById('day-2026-10-05')?.scrollIntoView({ inline: 'center', block: 'start' });
  document.querySelectorAll('.daychip').forEach((c) => c.addEventListener('click', () => { document.getElementById(`day-${c.dataset.day}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); document.querySelectorAll('.daychip').forEach((x) => x.classList.toggle('current', x === c)); }));
}
</script>
</body>
</html>
