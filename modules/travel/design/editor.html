.harness-frame { display: block; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.editor { position: fixed; }

<script>
const q = new URLSearchParams(location.search);
const type = q.get('type') || 'flight';
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
if (theme === 'light') document.documentElement.classList.add('light');
const TYPES = [['Getting there', [['flight', 'plane', 'Flight'], ['train', 'train', 'Train'], ['ferry', 'ship', 'Ferry'], ['bus', 'bus', 'Bus'], ['car', 'car', 'Car']]], ['Stay', [['hotel', 'bed', 'Stay']]], ['Eat and drink', [['restaurant', 'utensils', 'Restaurant'], ['cafe', 'mug-hot', 'Café'], ['bar', 'martini-glass', 'Bar']]], ['See and do', [['sight', 'monument', 'Sight'], ['museum', 'building-columns', 'Museum'], ['tour', 'person-hiking', 'Tour'], ['show', 'masks-theater', 'Show']]], ['Other', [['note', 'note-sticky', 'Note']]]];

if (!q.has('bare')) {
  document.body.className = 'harness';
  const all = TYPES.flatMap(([, l]) => l.map((x) => x[0]));
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="harness-bar">${opt('type', all, type)}${opt('theme', ['dark', 'light'], theme)}${opt('size', ['phone', 'pane', 'wide'], size)}</div>`);
  const w = { phone: 390, pane: 560, wide: 900 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 660}px`;
  f.src = `editor.html?bare=1&type=${type}&theme=${theme}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
