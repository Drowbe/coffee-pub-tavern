<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research: Ask, and the card the AI writes (design mock)</title>
<!--
  A static mock of the Ask panel of the Research module. The conversation is talk; anything worth keeping the model writes as a card inside
  its answer, and that card is drawn inline and can be kept or dragged like any card. Only cards are ever saved, never the conversation.
  Parameters: ?state=normal | streaming | kept, ?theme=light, ?w=390. Icons: Font Awesome Free from the repository (CC BY 4.0).
-->
<link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
<link rel="stylesheet" href="../../../public/sdk/tavern.css">
<link rel="stylesheet" href="../src/research.css">
<style>
html.light { --bg:#f4f1ec; --bg-section:#ffffff; --bg-card:#f6f2ea; --bg-input:#ffffff; --border:#d6cfc4; --text:#2a2118; --text-dim:#6f6558; --accent:#b8702a; --on-accent:#ffffff; --danger:#c0392b; }
body { display: block; margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#stage { margin: 0 auto; height: 640px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const w = Number(q.get('w')) || 560;
if (q.get('theme') === 'light') document.documentElement.classList.add('light');
const i = (n) => `<span class="ic"><i class="fa-solid fa-${n}" aria-hidden="true"></i></span>`;
const card = (kept) => `<article class="aicard${kept ? ' kept' : ''}" draggable="true" data-kind="card">
  <span class="badge">${i('hotel')}</span>
  <div><div class="kicker">Answer <span class="ai-mark">${i('wand-magic-sparkles')} AI</span></div><h3>Three hotels near Santa Apolónia, under €140</h3>
  <p class="content">Hotel Lisboa Plaza (€128, 4 min walk, breakfast included), Vincci Baixa (€135, 12 min, roof terrace) and Hotel Avenida Palace (€139, 9 min, the one already on the plan). The Plaza is the quietest; the Vincci has the best reviews for the room size.</p>
  <div class="tags"><span class="tag">hotels</span><span class="tag">lisbon</span><span class="tag">budget</span></div>
  <span class="place">${i('location-dot')} Santa Apolónia, Lisbon</span></div>
  <div class="actions"><button class="keep" type="button" title="${kept ? 'Kept in Research' : 'Keep in Research'}" aria-label="Keep in Research">${i(kept ? 'bookmark' : 'bookmark')}</button><button type="button" title="Copy the text" aria-label="Copy the text">${i('copy')}</button></div>
  <div class="sources">${i('link')} From: <a href="#">Lisbon hotels (note)</a> <a href="#">timeout.com/lisbon (link)</a> <a href="#">Budget (note)</a></div>
</article>`;
const thread = `
<div class="msg-you">What did we find about hotels near the station, and which is best for a tight budget?</div>
<div class="msg-ai"><div class="who">${i('wand-magic-sparkles')} AI · used 3 items</div>
<p>Looking at your three items, two hotels come up near Santa Apolónia and one further in. On price alone the Plaza wins, and the Vincci is the one people rave about.</p>
${state === 'streaming' ? '<div class="thinking">Writing the card…</div>' : card(state === 'kept')}
<p>If you'd like, I can turn this into a suggestion for day 2 of the plan, or check which of them has a free cancellation.</p></div>`;
document.getElementById('stage').style.width = w + 'px';
document.getElementById('stage').innerHTML = `<div class="ask"><header class="ask-head">${i('wand-magic-sparkles')}<h1>Ask</h1><span class="scope">${i('users')} This room · 3 items selected</span></header><div class="thread">${thread}</div><div class="composer"><textarea placeholder="Ask about the selected items" rows="1"></textarea><button class="btn btn-primary" type="button" aria-label="Send">${i('paper-plane')}</button></div></div>`;
</script>
</body>
</html>
