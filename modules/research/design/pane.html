<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research: the pane (design mock)</title>
<!--
  A static mock of the Research pane: a header with the Mine / This room switch, search, kind and tag filters, and a grid of cards (notes, links,
  photos, kept AI answers). The host's bottom bar is the quick add: type a note, or paste a link. Parameters: ?state=normal | photos | empty |
  uploading | position | filtered, ?theme=light, ?w=390 (narrow under 720). Icons: Font Awesome Free from the repository (CC BY 4.0).
-->
<link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
<link rel="stylesheet" href="../../../public/sdk/tavern.css">
<link rel="stylesheet" href="../src/research.css">
<style>
html.light { --bg:#f4f1ec; --bg-section:#ffffff; --bg-card:#f6f2ea; --bg-input:#ffffff; --border:#d6cfc4; --text:#2a2118; --text-dim:#6f6558; --accent:#b8702a; --on-accent:#ffffff; --danger:#c0392b; }
body { display: block; margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#stage { margin: 0 auto; height: 720px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const w = Number(q.get('w')) || 760;
if (q.get('theme') === 'light') document.documentElement.classList.add('light');
const i = (n) => `<span class="ic"><i class="fa-solid fa-${n}" aria-hidden="true"></i></span>`;
const TAGS = { hotels: '#c65f9a', food: '#e08a3c', lisbon: '#4f8fdd', 'to-do': '#3fae6a', budget: '#c9a227' };
const tag = (t) => `<span class="tag" style="--tag:${TAGS[t] || 'var(--text-dim)'}">${t}</span>`;
const by = (n) => `<span class="by"><span>${n[0]}</span></span>`;
const ICON = { note: 'note-sticky', link: 'link', photo: 'camera', answer: 'wand-magic-sparkles' };
const LABEL = { note: 'Note', link: 'Link', photo: 'Photo', answer: 'Answer' };
const card = (kind, title, body, tags, o = {}) => `<article class="rcard" data-kind="${kind}" tabindex="0" draggable="true">
  ${kind === 'photo' ? `<div class="thumb" style="background:linear-gradient(135deg, color-mix(in srgb, var(--tone) 55%, #223), color-mix(in srgb, var(--tone) 15%, #111))"></div>` : ''}
  <div class="top"><span class="kind">${i(ICON[kind])}</span><span class="kicker">${LABEL[kind]}${kind === 'answer' ? '<span class="ai-mark">AI</span>' : ''}</span><button class="menu" type="button" aria-label="Menu">${i('ellipsis')}</button></div>
  <h3>${title}</h3>
  ${o.site ? `<div class="site">${i('globe')} ${o.site}</div>` : ''}
  ${body ? `<p class="excerpt">${body}</p>` : ''}
  <div class="tags">${(tags || []).map(tag).join('')}</div>
  <div class="meta">${o.when ? `<span>${i('calendar-days')} ${o.when}</span>` : ''}${o.place ? `<span>${i('location-dot')} ${o.place}</span>` : ''}${o.n ? `<span>${i('paperclip')} ${o.n}</span>` : ''}${by(o.by || 'Thomas')}</div>
</article>`;
const cards = {
  normal: [
    card('answer', 'Three hotels near Santa Apolónia, under €140', 'Hotel Lisboa Plaza (€128, 4 min walk), Vincci Baixa (€135) and Hotel Avenida Palace (€139). The Plaza is the quietest.', ['hotels', 'lisbon', 'budget'], { place: 'Santa Apolónia', by: 'Alicia' }),
    card('note', 'Restaurant ideas from Christy', 'Cervejaria Ramiro for seafood (book ahead), Time Out Market for a quick lunch, and a fado night in Alfama. Ask about the tasting menu at Belcanto.', ['food', 'lisbon'], { by: 'Christy' }),
    card('link', 'Lisbon in 3 days: an itinerary', 'Day 1 Alfama and the castle, day 2 Belém, day 3 Sintra. Take the early train to beat the crowds.', ['to-do', 'lisbon'], { site: 'timeout.com', by: 'Thomas' }),
    card('note', 'Things to pack', 'Comfortable shoes (the hills), a light rain jacket, a universal adapter, and the passports.', ['to-do'], { by: 'Michelle' }),
    card('link', 'Tram 28: how it works', 'Boarding at Martim Moniz avoids the queue. Watch your pockets on the busy stretch.', ['lisbon'], { site: 'lisbon-guide.example', by: 'Alicia' }),
  ],
  photos: [
    card('photo', 'Rooftop at sunset', 'From the hotel terrace, day 2.', ['lisbon'], { when: 'Sun 4 Oct, 19:42', place: 'Alfama', by: 'Alicia' }),
    card('photo', 'The queue for tram 28', '', ['lisbon', 'to-do'], { when: 'Mon 5 Oct, 09:15', by: 'Thomas' }),
    card('photo', 'Pastéis de Belém', 'Worth the line.', ['food'], { when: 'Mon 5 Oct, 11:30', place: 'Belém', by: 'Christy' }),
    card('photo', 'Hotel lobby', '', ['hotels'], { when: 'Sat 3 Oct, 06:10', by: 'Michelle' }),
  ],
};
const list = state === 'photos' ? cards.photos : state === 'empty' ? [] : state === 'filtered' ? [cards.normal[1], cards.normal[2], cards.normal[4]] : cards.normal;
const chips = `<button class="rs-chip on">All</button><button class="rs-chip">${i('note-sticky')} Notes</button><button class="rs-chip">${i('link')} Links</button><button class="rs-chip">${i('camera')} Photos</button><button class="rs-chip">${i('wand-magic-sparkles')} Answers</button>`;
const tagChips = Object.entries(TAGS).map(([t, c]) => `<button class="rs-chip tag${state === 'filtered' && t === 'lisbon' ? ' on' : ''}" style="--tag:${c}">${t}</button>`).join('');
const upload = state === 'uploading' ? `<div class="upload"><span class="step">${i('image')}</span><span class="name">IMG_4821.HEIC</span><span class="bar"><span style="width:62%"></span></span><span class="step">Preparing…</span></div>` : '';
const pos = state === 'position' ? `<div class="pos-ask">${i('location-crosshairs')}<span class="grow">This photo has a position (near Alfama). Photos are shared without it unless you keep it.</span><button class="btn" type="button">Keep it</button><button class="btn" type="button">Leave it out</button></div>` : '';
const empty = `<div class="rs-empty">${i('book-open')}<h2>Nothing here yet</h2><p>Keep what you find: a note, a link with the part that mattered, a photo. Tag it so you can find it again, and drag it onto a plan.</p><p><button class="btn btn-primary" type="button">Write a note</button> <button class="btn" type="button">${i('camera')} Add a photo</button></p></div>`;
const narrow = w < 720;
document.getElementById('stage').style.width = w + 'px';
document.getElementById('stage').innerHTML = `<div class="rs${narrow ? ' narrow' : ''}">
<header class="rs-head"><h1>Research</h1><span class="count">${list.length}</span><div class="views" role="group" aria-label="Whose research"><button class="view" type="button" aria-pressed="false">${i('user')} Mine</button><button class="view" type="button" aria-pressed="true">${i('users')} This room</button></div></header>
<div class="rs-tools"><div class="rs-search">${i('magnifying-glass')}<input type="search" placeholder="Search research" value="${state === 'filtered' ? 'trip' : ''}"></div><button class="ai-btn" type="button">${i('wand-magic-sparkles')} Ask</button></div>
<div class="rs-chips">${chips}</div><div class="rs-chips">${tagChips}</div>
<main class="rs-body">${upload}${pos}${list.length ? `<div class="rs-grid">${list.join('')}</div>` : empty}</main>
<div class="rs-bar"><input type="text" placeholder="Write a note, or paste a link"><button class="btn btn-primary" type="button" title="Add">${i('plus')}</button><button class="btn" type="button" title="Add a photo">${i('camera')}</button></div></div>`;
</script>
</body>
</html>
