<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The page and every piece of markup the script clones. The script fills a clone by hooks only:
    [data-slot=name]   set its textContent (or hide it when there is no value)
    [data-icon=name]   replace its content with host.ui.icon(name)
  and toggles the state classes and data attributes listed in CONTRACT.md. It never builds markup from strings and
  never sets a style. The map library draws into #map and positions the pins (the one style it sets).
  The reference rendering is design/map.html.
-->
<div id="app" class="app" hidden>
  <div class="map-area">
    <div id="map" class="map"></div>
    <!-- what a search found: over the foot of the map, above the bar (the search itself is the host bar's field) -->
    <ul class="results" id="results" hidden></ul>
    <div class="maplibregl-ctrl-top-right" id="ctrl-zoom"></div>
    <div class="maplibregl-ctrl-bottom-right"><div class="attribution" data-slot="attribution">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div>
    <div class="banner" id="banner" hidden><span class="ic" data-icon="crosshairs"></span> <span data-slot="text">Click the map to place a pin</span><button class="btn" type="button" data-action="cancel">Cancel</button></div>
    <div id="callout" class="callout-box" hidden></div>
    <div id="state" class="state" hidden></div>
  </div>
  <p class="error" id="note" hidden></p>

</div>
<p id="msg" class="hint msg">Loading...</p>

<!-- ============================ templates ============================ -->

<!-- a pin: an HTML marker. data-kind is place (added in Maps), object (another module's object) or cluster (several close together).
     The script adds .selected for the pin whose summary is open, .dragging while a place is being moved, .draft for the new place's pin. -->
<template id="tpl-pin"><button class="pin" type="button"><span class="pin-body"><span class="ic" data-icon=""></span></span><span class="pin-label" data-slot="label"></span></button></template>
<template id="tpl-pin-cluster"><button class="pin cluster" type="button" data-kind="cluster"><span class="pin-body" data-slot="count"></span></button></template>

<!-- the callout of the selected place: over the map, with what can be done. The script sets data-kind and data-cat. -->
<template id="tpl-callout"><div class="callout"><button class="icon-btn callout-close" type="button" data-action="close-callout" aria-label="Close"><span class="ic" data-icon="xmark"></span></button><h3 data-slot="title"></h3><p class="callout-where"><span data-slot="where"></span> <span class="coords" data-slot="coords"></span></p><p class="callout-source"><span class="ic" data-icon=""></span> <span data-slot="from"></span><button class="open-link" type="button" data-action="open" title="Open it where it lives" aria-label="Open it where it lives"><span class="ic" data-icon="arrow-up-right-from-square"></span></button></p><div class="callout-actions"><a class="btn primary" data-action="open-in-maps" target="_blank" rel="noopener"><span class="ic" data-icon="arrow-up-right-from-square"></span> Open in my maps app</a><button class="btn" type="button" data-action="copy-coords"><span class="ic" data-icon="copy"></span> Copy coordinates</button></div></div></template>

<!-- a search result -->
<template id="tpl-result"><li><button class="result" type="button"><span class="ic" data-icon="location-dot"></span><span><span data-slot="title"></span><small data-slot="sub"></small></span></button></li></template>

<!-- states that replace the map; the script puts one of these in #state and un-hides it -->
<template id="tpl-state-loading"><div class="skel"></div></template>
<template id="tpl-state-nomap"><span class="ic" data-icon="map"></span><h2><span data-slot="own-name">Maps</span> is not set up yet</h2><p><span data-word="owner" data-word-form="a cap"></span> adds map files in Manage. Your places are in the <span data-slot="places-name">Places</span> <span data-word="module"></span>.</p></template>
<template id="tpl-state-nowebgl"><span class="ic" data-icon="map"></span><h2>This device cannot draw the map</h2><p>Your places are in the <span data-slot="places-name">Places</span> <span data-word="module"></span>, and each opens in your own maps app from there.</p></template>
<template id="tpl-state-error"><span class="ic" data-icon="triangle-exclamation"></span><h2>The map could not load</h2><p>The map file did not answer. Try again, or ask <span data-word="owner" data-word-form="a"></span> to check it.</p><p><button class="btn" type="button" data-action="retry">Try again</button></p></template>

<script>
/*__JS__*/
</script>
</body>
</html>
