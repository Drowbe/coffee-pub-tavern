<title>Maps: design mock</title>
<!--
  A static design mock of the Maps module, for agreeing the markup (see ../src/CONTRACT.md). Open it in a browser:
  a small harness (state, theme, size) wraps an iframe of this file, so the phone layout is a real 390px viewport.
  The map itself is a drawn stand-in (an SVG using the theme tokens, as the real map style will); pins are the real
  pin markup, placed by percentage here and by the map library in the module. render() below is the reference
  for the markup. Icons are inline SVG from Font Awesome Free (CC BY 4.0).
-->
<link rel="stylesheet" href="../../../public/sdk/tavern.css">
<link rel="stylesheet" href="../src/maps.css">
<style>
html.light { --bg:#f4f1ec; --bg-section:#ffffff; --bg-card:#f6f2ea; --bg-input:#ffffff; --border:#d6cfc4; --text:#2a2118; --text-dim:#6f6558; --accent:#b8702a; --on-accent:#ffffff; --danger:#c0392b; }
body.harness { display: block; overflow: auto; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.harness-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.harness-bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-dim); }
.harness-frame { display: block; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
/* the stand-in map and where its pins sit (the mock only) */
.fakemap { position: absolute; inset: 0; width: 100%; height: 100%; }
.fakemap .land { fill: var(--bg-section); }
.fakemap .water { fill: color-mix(in srgb, var(--text) 9%, var(--bg-section)); }
.fakemap .park { fill: color-mix(in srgb, var(--accent) 9%, var(--bg-section)); }
.fakemap .road { fill: none; stroke: color-mix(in srgb, var(--text) 16%, var(--bg-section)); stroke-width: 6; stroke-linecap: round; }
.fakemap .road.minor { stroke-width: 3; stroke: var(--border); }
.fakemap text { fill: var(--text-dim); font: 2.3px sans-serif; }
.pinpos { position: absolute; }
</style>
</head>

<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
if (theme === 'light') document.documentElement.classList.add('light');

if (!q.has('bare')) {
  document.body.className = 'harness';
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="harness-bar">${opt('state', ['normal', 'selected', 'selected-item', 'search', 'candidates', 'adding', 'noplaces', 'nosearch', 'loading', 'nomap-admin', 'nomap-member', 'nowebgl', 'error'], state)}${opt('theme', ['dark', 'light'], theme)}${opt('size', ['phone', 'pane', 'wide'], size)}<span class="hint">phone 390 wide, pane 560, wide 1100</span></div>`);
  const w = { phone: 390, pane: 560, wide: 1100 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 640}px`;
  f.src = `map.html?bare=1&state=${state}&theme=${theme}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
  }));
} else {
  const ic = (name) => `<span class="ic" data-icon="${name}"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
  const owners = (n) => n.length ? `<span class="owners" data-slot="owners" title="${n.join(', ')}">${n.map((x) => `<span class="owner">${x[0]}</span>`).join('')}</span>` : '';
  const SRC = { travel: ['suitcase', 'Travel'], calendar: ['calendar-days', 'Calendar'], todo: ['list-check', 'To-do'] };
  const P = [
    { id: 'p1', kind: 'place', title: 'Our meeting point', where: 'Praça do Comércio', lat: 38.7075, lng: -9.1364, notes: 'Under the arch, 09:15. Bring the tickets.', x: 46, y: 62, owners: ['Thomas', 'Christy'] },
    { id: 'p2', kind: 'place', title: 'Best pastéis', where: 'R. de Belém 84–92', lat: 38.6975, lng: -9.2033, notes: '', x: 22, y: 78, owners: [] },
    { id: 'i1', kind: 'item', src: 'travel', title: 'Hotel Avenida Palace', where: 'Rua 1º de Dezembro 101', lat: 38.7146, lng: -9.1405, sub: 'Stay · Oct 4–9', x: 52, y: 40, owners: ['Thomas'] },
    { id: 'i2', kind: 'item', src: 'travel', title: 'Belém Tower', where: 'Av. Brasília', lat: 38.6916, lng: -9.216, sub: 'Mon 5 Oct, 09:30', x: 14, y: 84, owners: ['Thomas', 'Christy'] },
    { id: 'i3', kind: 'item', src: 'calendar', title: 'Dinner: Cervejaria Ramiro', where: 'Av. Almirante Reis 1', lat: 38.7223, lng: -9.1356, sub: 'Sun 4 Oct, 20:00', x: 66, y: 24, owners: [] },
    { id: 'i4', kind: 'item', src: 'todo', title: 'Pick up tram passes', where: 'Rossio station', lat: 38.7139, lng: -9.1409, sub: 'Due Mon 5 Oct', x: 40, y: 32, owners: ['Cliff'] },
  ];
  const noPlaces = state === 'noplaces';
  const places = noPlaces ? [] : P;
  const sel = state === 'selected' ? 'p1' : state === 'selected-item' ? 'i1' : null;

  const fake = `<svg class="fakemap" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect class="land" width="100" height="100"/>
    <path class="water" d="M0 70 C 15 66, 30 76, 46 72 S 78 84, 100 78 L100 100 L0 100 Z"/>
    <path class="water" d="M62 0 C 66 12, 60 22, 68 34 S 90 40, 100 36 L100 0 Z" opacity=".7"/>
    <ellipse class="park" cx="30" cy="30" rx="16" ry="11"/>
    <path class="road" d="M0 52 C 25 50, 40 58, 100 46"/><path class="road" d="M38 0 C 42 30, 60 60, 54 100"/>
    <path class="road minor" d="M0 30 L100 22"/><path class="road minor" d="M70 0 L74 100"/><path class="road minor" d="M10 100 L44 60"/><path class="road minor" d="M0 88 L60 80"/>
    <text x="8" y="26">Parque</text><text x="30" y="80">Rio Tejo</text><text x="46" y="52">Baixa</text>
  </svg>`;
  const pin = (p, selected) => {
    const icon = p.kind === 'item' ? SRC[p.src][0] : 'location-dot';
    return `<div class="pinpos" style="left:${p.x}%;top:${p.y}%"><button class="pin${selected ? ' selected' : ''}" type="button" data-id="${p.id}" data-kind="${p.kind}" aria-label="${p.title}"><span class="pin-body">${ic(icon)}</span><span class="pin-label">${p.title}</span></button></div>`;
  };
  const cluster = `<div class="pinpos" style="left:60%;top:56%"><button class="pin cluster" type="button" data-kind="cluster" aria-label="3 places, zoom in"><span class="pin-body">3</span></button></div>`;
  const selectedP = sel && P.find((p) => p.id === sel);
  const callout = (p) => `<div class="callout-box" id="callout"><div class="callout" data-kind="${p.kind}" data-cat="${p.cat || 'stay'}"><button class="icon-btn callout-close" type="button" data-action="close-callout" aria-label="Close">${ic('xmark')}</button>
    <h3 data-slot="title">${p.title}</h3>
    <p class="callout-where"><span data-slot="where">${p.where}</span> <span class="coords" data-slot="coords">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span></p>
    ${p.kind === 'item' ? `<p class="callout-source" data-slot="source">${ic(SRC[p.src][0])} <span data-slot="from">from ${SRC[p.src][1]} · ${p.sub}</span><button class="btn" type="button" data-action="open">Open</button></p>` : ''}
    <div class="callout-actions"><a class="btn primary" data-action="open-in-maps" href="geo:${p.lat},${p.lng}">${ic('arrow-up-right-from-square')} Open in my maps app</a><button class="btn" type="button" data-action="copy-coords">${ic('copy')} Copy coordinates</button></div></div></div>`;

  const search = (open) => state === 'nosearch' ? '' : `<div class="search" id="search">${ic('magnifying-glass')}<input type="search" placeholder="Search for a place" aria-label="Search for a place" ${open ? 'value="belém"' : ''}>${open ? `<ul class="results" id="results"><li><button class="result on" type="button">${ic('location-dot')}<span>Belém Tower<small>Av. Brasília, Lisbon, Portugal</small></span></button></li><li><button class="result" type="button">${ic('location-dot')}<span>Belém, Lisbon<small>Neighbourhood, Portugal</small></span></button></li><li><button class="result" type="button">${ic('location-dot')}<span>Pastéis de Belém<small>R. de Belém 84–92, Lisbon</small></span></button></li></ul>` : ''}</div>`;
  const tools = `<div class="tools"><button class="tool${state === 'adding' || state === 'editor' ? ' on' : ''}" type="button" data-action="add-place">${ic('plus')} Add place</button></div>`;
  const zoom = `<div class="maplibregl-ctrl-top-right"><div class="maplibregl-ctrl-group"><button type="button" aria-label="Zoom in">${ic('plus')}</button><button type="button" aria-label="Zoom out">${ic('minus')}</button><button type="button" aria-label="Show my location">${ic('location-crosshairs')}</button></div></div>`;
  const attrib = `<div class="maplibregl-ctrl-bottom-right"><div class="attribution" data-slot="attribution">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div></div>`;
  const stateBlock = (icn, h, p, extra = '') => `<div class="state" id="state">${ic(icn)}<h2>${h}</h2><p>${p}</p>${extra}</div>`;

  let body;
  if (state === 'loading') body = `<div class="app" id="app"><div class="stage"><div class="map"><div class="skel"></div></div></div></div>`;
  else if (state === 'nomap-admin') body = `<div class="app" id="app"><div class="stage">${stateBlock('map', 'No map yet', 'Maps needs a map file on this server. Put a PMTiles file in the data folder, then pick it in Manage > Modules > Maps > Settings.', '<p><a class="btn btn-primary" data-action="open-settings" href="#">Open the Maps settings</a></p>')}</div></div>`;
  else if (state === 'nomap-member') body = `<div class="app" id="app"><div class="stage">${stateBlock('map', 'Maps is not set up', 'An admin needs to add a map file to this server first. Your places are in the Places module.')}</div></div>`;
  else if (state === 'error') body = `<div class="app" id="app"><div class="stage">${stateBlock('triangle-exclamation', 'The map could not load', 'The map file did not answer. Try again, or ask an admin to check it.', '<p><button class="btn" type="button" data-action="retry">Try again</button></p>')}</div></div>`;
  else if (state === 'nowebgl') body = `<div class="app" id="app"><div class="stage">${stateBlock('map', 'This device cannot draw the map', 'Your places are in the Places module, and each opens in your own maps app from there.')}</div></div>`;
  else {
    const pins = places.map((p) => pin(p, p.id === sel)).join('') + (places.length ? cluster : '') + (state === 'candidates' ? [[30, 62, 'Colosseum'], [52, 40, 'Trattoria al Colosseo'], [70, 58, 'Colosseo (metro)']].map(([x, y, t]) => `<div class="pinpos" style="left:${x}%;top:${y}%"><button class="pin candidate" type="button" aria-label="${t}"><span class="pin-body">${ic('location-dot')}</span><span class="pin-label">${t}</span></button></div>`).join('') : '') + (state === 'adding' ? `<div class="pinpos" style="left:48%;top:46%"><button class="pin draft" type="button" aria-label="New place"><span class="pin-body">${ic('plus')}</span></button></div>` : '');
    const banner = state === 'adding' ? `<div class="banner" id="banner">${ic('crosshairs')} <span>Click the map to place a pin</span><button class="btn" type="button" data-action="cancel">Cancel</button></div>` : '';
    const open = ['selected', 'selected-item', 'normal', 'noplaces', 'search', 'nosearch'].includes(state) && (state !== 'search') ;
    body = `<div class="app" id="app"><div class="stage"><div class="map${state === 'adding' ? ' adding' : ''}" id="map">${fake}${pins}</div><div class="mapbar">${search(state === 'search')}${tools}</div>${zoom}${attrib}${banner}${selectedP ? callout(selectedP) : ''}</div></div>`;
  }
  document.body.insertAdjacentHTML('beforeend', body);
}
</script>
</body>
</html>
