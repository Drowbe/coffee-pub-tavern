<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Places: design mock</title>
<!--
  A static design mock of the Places module, for agreeing the markup (see ../src/CONTRACT.md). Open it in a browser: a small
  harness (state, theme, size) wraps an iframe of this file, so the narrow layout is a real 390px viewport. In the module the
  script sets `.narrow` on `.app` from the pane's width; here the mock does it from its own width. render() below is the reference
  for the markup. Icons are inline SVG from Font Awesome Free (CC BY 4.0).
-->
<link rel="stylesheet" href="../../../public/sdk/tavern.css">
<link rel="stylesheet" href="../src/places.css">
<style>
html.light { --bg:#f4f1ec; --bg-section:#ffffff; --bg-card:#f6f2ea; --bg-input:#ffffff; --border:#d6cfc4; --text:#2a2118; --text-dim:#6f6558; --accent:#b8702a; --on-accent:#ffffff; --danger:#c0392b; }
body.harness { display: block; overflow: auto; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.harness-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.harness-bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-dim); }
.harness-frame { display: block; margin: 0 auto; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-magnifying-glass" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376C296.3 401.1 253.9 416 208 416 93.1 416 0 322.9 0 208S93.1 0 208 0 416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></symbol><symbol id="i-plus" viewBox="0 0 448 512"><path d="M256 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 160-160 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l160 0 0 160c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160 160 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-160 0 0-160z"/></symbol><symbol id="i-pen" viewBox="0 0 512 512"><path d="M352.9 21.2L308 66.1 445.9 204 490.8 159.1C504.4 145.6 512 127.2 512 108s-7.6-37.6-21.2-51.1L455.1 21.2C441.6 7.6 423.2 0 404 0s-37.6 7.6-51.1 21.2zM274.1 100L58.9 315.1c-10.7 10.7-18.5 24.1-22.6 38.7L.9 481.6c-2.3 8.3 0 17.3 6.2 23.4s15.1 8.5 23.4 6.2l127.8-35.5c14.6-4.1 27.9-11.8 38.7-22.6L412 237.9 274.1 100z"/></symbol><symbol id="i-trash" viewBox="0 0 448 512"><path d="M136.7 5.9L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-8.7-26.1C306.9-7.2 294.7-16 280.9-16L167.1-16c-13.8 0-26 8.8-30.4 21.9zM416 144L32 144 53.1 467.1C54.7 492.4 75.7 512 101 512L347 512c25.3 0 46.3-19.6 47.9-44.9L416 144z"/></symbol><symbol id="i-copy" viewBox="0 0 448 512"><path d="M192 0c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-200.6c0-17.4-7.1-34.1-19.7-46.2L370.6 17.8C358.7 6.4 342.8 0 326.3 0L192 0zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-16-64 0 0 16-192 0 0-256 16 0 0-64-16 0z"/></symbol><symbol id="i-arrow-up-right-from-square" viewBox="0 0 512 512"><path d="M320 0c-17.7 0-32 14.3-32 32s14.3 32 32 32l82.7 0-201.4 201.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L448 109.3 448 192c0 17.7 14.3 32 32 32s32-14.3 32-32l0-160c0-17.7-14.3-32-32-32L320 0zM80 96C35.8 96 0 131.8 0 176 32 32S0 465.7 0 448L0 64C0 46.3 14.3 32 32 32zm80 160a64 64 0 1 1 128 0 64 64 0 1 1 -128 0z"/></symbol><symbol id="i-plane" viewBox="0 0 576 512"><path d="M520 200c30.9 0 56 25.1 56 56s-25.1 56-56 56l-127.3 0-159.2 173.6c-6.1 6.6-14.6 10.4-23.6 10.4l-43.7 0c-10.9 0-18.6-10.7-15.2-21.1l54.3-162.9-99.7 0-52.8 66c-3 3.8-7.6 6-12.5 6l-19.8 0c-10.4 0-18-9.8-15.5-19.9L32 256 5 147.9C2.4 137.8 10.1 128 20.5 128l19.8 0c4.9 0 9.5 2.2 12.5 6l52.8 66 99.7 0-54.3-162.9C147.6 26.7 155.3 16 166.2 16l43.7 0c9 0 17.5 3.8 23.6 10.4L392.7 200 520 200z"/></symbol><symbol id="i-note-sticky" viewBox="0 0 448 512"><path d="M64 480c-35.3 0-64-28.7-64-64L0 96C0 60.7 28.7 32 64 32l320 0c35.3 0 64 28.7 64 64l0 213.5c0 17-6.7 33.3-18.7 45.3L322.7 461.3c-12 12-28.3 18.7-45.3 18.7L64 480zM389.5 304L296 304c-13.3 0-24 10.7-24 24l0 93.5 117.5-117.5z"/></symbol><symbol id="i-suitcase" viewBox="0 0 512 512"><path d="M200 48l112 0c4.4 0 8 3.6 8 8l0 40-128 0 0-40c0-4.4 3.6-8 8-8zm-56 8l0 424 224 0 0-424c0-30.9-25.1-56-56-56L200 0c-30.9 0-56 25.1-56 56zM416 96l0 384 32 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-32 0zM96 480l0-384-32 0C28.7 96 0 124.7 0 160L0 416c0 35.3 28.7 64 64 64l32 0z"/></symbol><symbol id="i-calendar-days" viewBox="0 0 448 512"><path d="M128 0c17.7 0 32 14.3 32 32l0 32 128 0 0-32c0-17.7 14.3-32 32-32s32 14.3 32 32l0 32 32 0c35.3 0 64 28.7 64 64l0 288c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 128C0 92.7 28.7 64 64 64l32 0 0-32c0-17.7 14.3-32 32-32zM64 240l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16zm128 0l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16zm144-16c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0zM64 368l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16zm144-16c-8.8 0-16 7.2-16 16l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0zm112 16l0 32c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-32c0-8.8-7.2-16-16-16l-32 0c-8.8 0-16 7.2-16 16z"/></symbol><symbol id="i-list-check" viewBox="0 0 512 512"><path d="M133.8 36.3c10.9 7.6 13.5 22.6 5.9 33.4l-56 80c-4.1 5.8-10.5 9.5-17.6 10.1S52 158 47 153L7 113C-2.3 103.6-2.3 88.4 7 79S31.6 69.7 41 79l19.8 19.8 39.6-56.6c7.6-10.9 22.6-13.5 33.4-5.9zm0 160c10.9 7.6 13.5 22.6 5.9 33.4l-56 80c-4.1 5.8-10.5 9.5-17.6 10.1S52 318 47 313L7 273c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l19.8 19.8 39.6-56.6c7.6-10.9 22.6-13.5 33.4-5.9zM224 96c0-17.7 14.3-32 32-32l224 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-224 0c-17.7 0-32-14.3-32-32zm0 160c0-17.7 14.3-32 32-32l224 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-224 0c-17.7 0-32-14.3-32-32zM160 416c0-17.7 14.3-32 32-32l288 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-288 0c-17.7 0-32-14.3-32-32zM64 376a40 40 0 1 1 0 80 40 40 0 1 1 0-80z"/></symbol><symbol id="i-xmark" viewBox="0 0 384 512"><path d="M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z"/></symbol></svg>
<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
if (theme === 'light') document.documentElement.classList.add('light');

if (!q.has('bare')) {
  document.body.className = 'harness';
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="harness-bar">${opt('state', ['normal', 'filtered', 'noresults', 'empty', 'loading', 'menu', 'editor', 'viewer', 'conflict'], state)}${opt('theme', ['dark', 'light'], theme)}${opt('size', ['phone', 'pane', 'wide'], size)}<span class="hint">phone 390 wide, pane 560, wide 1100</span></div>`);
  const w = { phone: 390, pane: 560, wide: 1100 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 640}px`;
  f.src = `places.html?bare=1&state=${state}&theme=${theme}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
  }));
} else {
  const ic = (name) => `<span class="ic" data-icon="${name}"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
  const CATS = { do: ['landmark', 'Things to do'], eat: ['utensils', 'Food'], stay: ['bed', 'Stay'], travel: ['plane', 'Travel'], other: ['note-sticky', 'Other'] };
  const owners = (n) => n.length ? `<span class="owners" data-slot="owners" title="${n.join(', ')}">${n.map((x) => `<span class="owner">${x[0]}</span>`).join('')}</span>` : '';
  const LINKS = { travel: ['suitcase', 'Trip'], calendar: ['calendar-days', 'Event'], todo: ['list-check', 'Task'] };
  const P = [
    { id: 'p1', cat: 'stay', title: 'Hotel Avenida Palace', address: 'Rua 1º de Dezembro 101, Lisbon', point: 1, owners: ['Thomas'], links: [['travel', 'Lisbon: stay, Oct 4–9']] },
    { id: 'p2', cat: 'eat', title: 'Cervejaria Ramiro', address: 'Av. Almirante Reis 1, Lisbon', point: 1, owners: ['Alicia', 'Mark'], links: [['calendar', 'Dinner, Sun 4 Oct']] },
    { id: 'p3', cat: 'eat', title: 'Pastéis de Belém', address: 'R. de Belém 84–92', point: 1, owners: [], links: [] },
    { id: 'p4', cat: 'do', title: 'Belém Tower', address: 'Av. Brasília', point: 1, owners: ['Thomas', 'Christy'], links: [['travel', 'Lisbon: Mon 5 Oct']] },
    { id: 'p5', cat: 'do', title: 'Sunset viewpoint (find one)', address: '', point: 0, owners: [], links: [] },
    { id: 'p6', cat: 'travel', title: 'Humberto Delgado Airport', address: 'Alameda das Comunidades Portuguesas', point: 1, owners: [], links: [['todo', 'Print boarding passes']] },
    { id: 'p7', cat: 'other', title: 'Pharmacy near the hotel', address: 'Rua Áurea', point: 0, owners: ['Cliff'], links: [] },
  ];
  const noEdit = state === 'viewer';
  const list = state === 'empty' || state === 'loading' ? [] : state === 'noresults' ? [] : state === 'filtered' ? P.filter((p) => p.cat === 'eat') : P;
  const row = (p) => `<article class="place-row" tabindex="0" data-id="${p.id}" data-cat="${p.cat}"><span class="mark">${ic(CATS[p.cat][0])}</span><div class="main"><h3 class="title" data-slot="title">${p.title}</h3>${p.address ? `<p class="sub" data-slot="address">${p.address}</p>` : ''}<div class="meta">${p.point ? `<span class="pinned" data-slot="pinned">${ic('location-dot')} On the map</span>` : '<span class="nopos" data-slot="nopos">No position yet</span>'}${owners(p.owners)}${p.links.length ? `<span class="links" data-slot="links">${p.links.map(([k, t]) => `<span class="link">${ic(LINKS[k][0])} <b>${LINKS[k][1]}</b> ${t}</span>`).join('')}</span>` : ''}</div></div><button class="item-menu" type="button" data-action="menu" aria-label="Place menu">${ic('ellipsis')}</button></article>`;
  const groups = () => Object.keys(CATS).map((c) => [c, list.filter((p) => p.cat === c)]).filter(([, l]) => l.length).map(([c, l]) => `<section class="group"><h2 class="group-title">${ic(CATS[c][0])}<span data-slot="title">${CATS[c][1]}</span></h2><div class="rows">${l.map(row).join('')}</div></section>`).join('');
  const chips = () => `<button class="chip${state === 'filtered' ? '' : ' on'}" type="button" data-cat="">All <span class="count">${P.length}</span></button>${Object.keys(CATS).map((c) => `<button class="chip${state === 'filtered' && c === 'eat' ? ' on' : ''}" type="button" data-cat="${c}">${ic(CATS[c][0])}${CATS[c][1]} <span class="count">${P.filter((p) => p.cat === c).length}</span></button>`).join('')}`;
  const menu = `<div id="item-menu" class="menu" role="menu" style="top:190px;right:16px"><button type="button" role="menuitem" data-action="edit">${ic('pen')} <span>Edit</span></button><a role="menuitem" data-action="open-in-maps" href="#">${ic('arrow-up-right-from-square')} Open in my maps app</a><button type="button" role="menuitem" data-action="copy-coords">${ic('copy')} Copy coordinates</button><button type="button" role="menuitem" class="danger" data-action="delete">${ic('trash')} Delete</button></div>`;
  const p0 = P[3];
  const editor = () => `<div class="editor" id="editor"><form class="editor-card" id="form"><h3 id="editor-title">${noEdit ? p0.title : 'Edit place'}</h3>
    ${noEdit ? `<div class="readonly"><dl><dt>Category</dt><dd>Things to do</dd><dt>Address</dt><dd>${p0.address}</dd><dt>Position</dt><dd>38.6916, -9.2160</dd><dt>Whose</dt><dd>Thomas, Christy</dd></dl><p>Book the early slot; closed Mondays.</p></div>` : `<label>Name<input id="f-title" type="text" value="${p0.title}"></label><div class="editor-row"><label>Category<select id="f-category"><option>Things to do</option></select></label><label>Address<input id="f-address" type="text" value="${p0.address}"></label></div><label>Position<input id="f-point" type="text" value="38.6916, -9.2160"><span class="hint" id="f-point-note">Coordinates found. Paste a map link to change them.</span></label><label>Notes<textarea id="f-notes" rows="3">Book the early slot; closed Mondays.</textarea></label><div><div class="hint">Whose is it</div><div class="editor-people" id="f-owners"><label class="check"><input type="checkbox" checked> Thomas</label><label class="check"><input type="checkbox" checked> Christy</label><label class="check"><input type="checkbox"> Cliff</label><label class="check"><input type="checkbox"> Alicia</label><label class="check"><input type="checkbox"> Mark</label></div></div>`}
    <div class="editor-links" id="f-links-out"><a class="btn" id="f-open-in-maps" href="#">${ic('arrow-up-right-from-square')} Open in my maps app</a></div>
    <div class="used-by" id="f-used-by"><div class="used-by-title">Used by</div><div class="links"><span class="link">${ic('suitcase')} <b>Trip</b> Lisbon: Mon 5 Oct</span></div></div>
    ${state === 'conflict' ? '<div class="conflict-bar" role="alert"><span>Christy changed this while you were editing.</span><button class="btn" type="button" data-action="use-theirs">Use theirs</button><button class="btn" type="button" data-action="keep-mine">Keep mine</button></div>' : ''}
    <p class="hint" id="f-by">Last changed by Christy, today 14:02</p>
    <div class="editor-buttons">${noEdit ? '' : '<button class="btn btn-primary" type="submit">Save</button>'}<button class="btn" type="button">Close</button><span class="grow"></span>${noEdit ? '' : '<button class="btn btn-danger" type="button">Delete</button>'}</div></form></div>`;

  let body;
  const head = `<header class="head"><h1>Places</h1><span class="count" data-slot="count">${state === 'filtered' ? '3 of 7' : list.length || (state === 'noresults' ? 0 : 7)}</span><div class="filter">${ic('magnifying-glass')}<input id="filter" type="search" placeholder="Filter places" value="${state === 'noresults' ? 'zzz' : ''}"></div></header>`;
  if (state === 'loading') body = `<div class="app" id="app">${head}<main class="body"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main></div>`;
  else if (state === 'empty') body = `<div class="app" id="app"><main class="body"><div class="state" id="state-empty">${ic('location-dot')}<h2>No places yet</h2><p>Save the places your group cares about: where you are staying, where to eat, what to see. Each can be found on the map and linked from a trip, an event or a task.</p><p><button class="btn btn-primary" type="button" data-action="add-place">Add a place</button></p></div></main></div>`;
  else if (state === 'noresults') body = `<div class="app" id="app">${head}<div class="chips" id="chips">${chips()}</div><main class="body"><div class="state" id="state-noresults"><h2>Nothing matches</h2><p>No place matches your filter.</p><p><button class="btn" type="button" data-action="clear-filter">Show everything</button></p></div></main></div>`;
  else body = `<div class="app" id="app">${head}<div class="chips" id="chips">${chips()}</div><main class="body" id="body">${groups()}</main>${state === 'menu' ? menu : ''}${['editor', 'viewer', 'conflict'].includes(state) ? editor() : ''}</div>`;
  document.body.insertAdjacentHTML('beforeend', body);
  const app = document.getElementById('app');
  const fit = () => app.classList.toggle('narrow', document.body.clientWidth < 720);
  fit(); new ResizeObserver(fit).observe(document.body);
}
</script>
</body>
</html>
