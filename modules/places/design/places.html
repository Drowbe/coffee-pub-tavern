<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'normal';
const theme = q.get('theme') || 'dark';
const size = q.get('size') || 'phone';
if (theme === 'light') document.documentElement.classList.add('light');

if (!q.has('bare')) {
  document.body.className = 'harness';
  const opt = (name, values, cur) => `<label>${name} <select data-k="${name}">${values.map((v) => `<option${v === cur ? ' selected' : ''}>${v}</option>`).join('')}</select></label>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="harness-bar">${opt('state', ['normal', 'filtered', 'noresults', 'empty', 'loading', 'menu', 'editor', 'viewer', 'conflict', 'mine', 'everyone', 'searching', 'found', 'notfound'], state)}${opt('theme', ['dark', 'light'], theme)}${opt('size', ['phone', 'pane', 'wide'], size)}<span class="hint">phone 390 wide, pane 560, wide 1100</span></div>`);
  const w = { phone: 390, pane: 560, wide: 1100 }[size];
  const f = document.createElement('iframe');
  f.className = 'harness-frame';
  f.style.cssText = `width:${w}px;height:${size === 'phone' ? 720 : 640}px`;
  f.src = `places.html?bare=1&state=${state}&theme=${theme}`;
  document.body.appendChild(f);
  document.querySelectorAll('.harness-bar select').forEach((s) => s.addEventListener('change', () => {
    const p = new URLSearchParams(location.search);
    document.querySelectorAll('.harness-bar select').forEach((x) => p.set(x.dataset.k, x.value));
    location.search = p.toString();
  }));
} else {
  const ic = (name) => `<span class="ic" data-icon="${name}"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#i-${name}"/></svg></span>`;
  const CATS = { do: ['landmark', 'Things to do'], eat: ['utensils', 'Food'], stay: ['bed', 'Stay'], travel: ['plane', 'Travel'], other: ['note-sticky', 'Other'] };
  const owners = (n) => n.length ? `<span class="owners" data-slot="owners" title="${n.join(', ')}">${n.map((x) => `<span class="owner">${x[0]}</span>`).join('')}</span>` : '';
  const LINKS = { travel: ['suitcase', 'Trip'], calendar: ['calendar-days', 'Event'], todo: ['list-check', 'Task'] };
  const P = [
    { id: 'p1', cat: 'stay', title: 'Hotel Avenida Palace', address: 'Rua 1º de Dezembro 101, Lisbon', point: 1, owners: ['Thomas'], links: [['travel', 'Lisbon: stay, Oct 4–9']] },
    { id: 'p2', cat: 'eat', title: 'Cervejaria Ramiro', address: 'Av. Almirante Reis 1, Lisbon', point: 1, owners: ['Alicia', 'Mark'], links: [['calendar', 'Dinner, Sun 4 Oct']] },
    { id: 'p3', cat: 'eat', title: 'Pastéis de Belém', address: 'R. de Belém 84–92', point: 1, owners: [], links: [] },
    { id: 'p4', cat: 'do', title: 'Belém Tower', address: 'Av. Brasília', point: 1, owners: ['Thomas', 'Christy'], links: [['travel', 'Lisbon: Mon 5 Oct']] },
    { id: 'p5', cat: 'do', title: 'Sunset viewpoint (find one)', address: '', point: 0, owners: [], links: [] },
    { id: 'p6', cat: 'travel', title: 'Humberto Delgado Airport', address: 'Alameda das Comunidades Portuguesas', point: 1, owners: [], links: [['todo', 'Print boarding passes']] },
    { id: 'p7', cat: 'other', title: 'Pharmacy near the hotel', address: 'Rua Áurea', point: 0, owners: ['Cliff'], links: [] },
  ];
  const noEdit = state === 'viewer' || state === 'everyone';
  // views: the same places at three scopes (mine follows the person into every room; everyone is the server's)
  const view = state === 'mine' ? 'my' : state === 'everyone' ? 'global' : 'room';
  const VIEWS = [['my', 'user', 'Mine'], ['room', 'users', 'This room'], ['global', 'globe', 'Everyone']];
  const NOTES = { my: 'Only you see these. They follow you into every room.', room: '', global: 'Everyone on this server sees these. Moderators change them.' };
  const views = `<div class="views" role="group" aria-label="Whose places">${VIEWS.map(([v, i, l]) => `<button class="view" type="button" data-view="${v}" aria-pressed="${v === view}">${ic(i)}${l}</button>`).join('')}</div>`;
  const note = NOTES[view] ? `<p class="view-note" data-slot="view-note">${ic('circle-info')}${NOTES[view]}</p>` : '';
  // find a place: results over the bottom bar (only when a search address is set)
  const FOUND = [['landmark', 'Colosseum', 'Piazza del Colosseo, Roma'], ['utensils', 'Trattoria al Colosseo', 'Via Capo d’Africa 29, Roma'], ['landmark', 'Colosseo (metro station)', 'Piazza del Colosseo, Roma'], ['bed', 'Hotel Palazzo Manfredi', 'Via Labicana 125, Roma']];
  const closeBtn = `<button class="found-close" type="button" data-action="close-found" aria-label="Close results">${ic('xmark')}</button>`;
  const found = state === 'found'
    ? `<div class="found" id="found" role="listbox" aria-label="Search results"><div class="found-head"><span>Results for</span><b>“colosseo”</b><span class="grow"></span>${closeBtn}</div><div class="found-rows">${FOUND.map(([i, t, a]) => `<div class="found-row" role="option" tabindex="0"><span class="mark">${ic(i)}</span><div><h3 class="title">${t}</h3><p class="sub">${a}</p></div><button class="btn btn-primary" type="button" data-action="save-found">Save</button></div>`).join('')}</div></div>`
    : state === 'searching' ? `<div class="found" id="found"><div class="found-head"><span>Searching for</span><b>“colosseo”</b></div><div class="found-rows"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div></div></div></div>`
    : state === 'notfound' ? `<div class="found" id="found"><div class="found-head"><span>Results for</span><b>“xyzzy”</b><span class="grow"></span>${closeBtn}</div><p class="found-state">Nothing found. Try a fuller name, or paste coordinates or a map link.</p></div>` : '';
  const list = state === 'empty' || state === 'loading' ? [] : state === 'noresults' ? [] : state === 'filtered' ? P.filter((p) => p.cat === 'eat') : state === 'mine' ? P.filter((p) => ['p5', 'p7', 'p3'].includes(p.id)) : state === 'everyone' ? P.filter((p) => ['p6', 'p1'].includes(p.id)) : P;
  const row = (p) => `<article class="place-row" tabindex="0" data-id="${p.id}" data-cat="${p.cat}"><span class="mark">${ic(CATS[p.cat][0])}</span><div class="main"><h3 class="title" data-slot="title">${p.title}</h3>${p.address ? `<p class="sub" data-slot="address">${p.address}</p>` : ''}<div class="meta">${p.point ? `<span class="pinned" data-slot="pinned">${ic('location-dot')} On the map</span>` : '<span class="nopos" data-slot="nopos">No position yet</span>'}${owners(p.owners)}${p.links.length ? `<span class="links" data-slot="links">${p.links.map(([k, t]) => `<span class="link">${ic(LINKS[k][0])} <b>${LINKS[k][1]}</b> ${t}</span>`).join('')}</span>` : ''}</div></div><button class="item-menu" type="button" data-action="menu" aria-label="Place menu">${ic('ellipsis')}</button></article>`;
  const groups = () => Object.keys(CATS).map((c) => [c, list.filter((p) => p.cat === c)]).filter(([, l]) => l.length).map(([c, l]) => `<section class="group"><h2 class="group-title">${ic(CATS[c][0])}<span data-slot="title">${CATS[c][1]}</span></h2><div class="rows">${l.map(row).join('')}</div></section>`).join('');
  const chips = () => `<button class="chip${state === 'filtered' ? '' : ' on'}" type="button" data-cat="">All <span class="count">${P.length}</span></button>${Object.keys(CATS).map((c) => `<button class="chip${state === 'filtered' && c === 'eat' ? ' on' : ''}" type="button" data-cat="${c}">${ic(CATS[c][0])}${CATS[c][1]} <span class="count">${P.filter((p) => p.cat === c).length}</span></button>`).join('')}`;
  const menu = `<div id="item-menu" class="menu" role="menu" style="top:190px;right:16px"><button type="button" role="menuitem" data-action="edit">${ic('pen')} <span>Edit</span></button><a role="menuitem" data-action="open-in-maps" href="#">${ic('arrow-up-right-from-square')} Open in my maps app</a><button type="button" role="menuitem" data-action="copy-coords">${ic('copy')} Copy coordinates</button><button type="button" role="menuitem" class="danger" data-action="delete">${ic('trash')} Delete</button></div>`;
  const p0 = P[3];
  const editor = () => `<div class="editor" id="editor"><form class="editor-card" id="form"><h3 id="editor-title">${noEdit ? p0.title : 'Edit place'}</h3>
    ${noEdit ? `<div class="readonly"><dl><dt>Category</dt><dd>Things to do</dd><dt>Address</dt><dd>${p0.address}</dd><dt>Position</dt><dd>38.6916, -9.2160</dd><dt>Whose</dt><dd>Thomas, Christy</dd></dl><p>Book the early slot; closed Mondays.</p></div>` : `<label>Name<input id="f-title" type="text" value="${p0.title}"></label><div class="editor-row"><label>Category<select id="f-category"><option>Things to do</option></select></label><label>Address<input id="f-address" type="text" value="${p0.address}"></label></div><label>Position<input id="f-point" type="text" value="38.6916, -9.2160"><span class="hint" id="f-point-note">Coordinates found. Paste a map link to change them.</span></label><label>Notes<textarea id="f-notes" rows="3">Book the early slot; closed Mondays.</textarea></label><div><div class="hint">Whose is it</div><div class="editor-people" id="f-owners"><label class="check"><input type="checkbox" checked> Thomas</label><label class="check"><input type="checkbox" checked> Christy</label><label class="check"><input type="checkbox"> Cliff</label><label class="check"><input type="checkbox"> Alicia</label><label class="check"><input type="checkbox"> Mark</label></div></div>`}
    <div class="editor-links" id="f-links-out"><a class="btn" id="f-open-in-maps" href="#">${ic('arrow-up-right-from-square')} Open in my maps app</a></div>
    <div class="used-by" id="f-used-by"><div class="used-by-title">Used by</div><div class="links"><span class="link">${ic('suitcase')} <b>Trip</b> Lisbon: Mon 5 Oct</span></div></div>
    ${state === 'conflict' ? '<div class="conflict-bar" role="alert"><span>Christy changed this while you were editing.</span><button class="btn" type="button" data-action="use-theirs">Use theirs</button><button class="btn" type="button" data-action="keep-mine">Keep mine</button></div>' : ''}
    <p class="hint" id="f-by">Last changed by Christy, today 14:02</p>
    <div class="editor-buttons">${noEdit ? '' : '<button class="btn btn-primary" type="submit">Save</button>'}<button class="btn" type="button">Close</button><span class="grow"></span>${noEdit ? '' : '<button class="btn btn-danger" type="button">Delete</button>'}</div></form></div>`;

  let body;
  const head = `<header class="head"><h1>Places</h1><span class="count" data-slot="count">${state === 'filtered' ? '3 of 7' : list.length || (state === 'noresults' ? 0 : 7)}</span><div class="filter">${ic('magnifying-glass')}<input id="filter" type="search" placeholder="Filter places" value="${state === 'noresults' ? 'zzz' : ''}"></div>${views}</header>${note}`;
  if (state === 'loading') body = `<div class="app" id="app">${head}<main class="body"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main></div>`;
  else if (state === 'empty') body = `<div class="app" id="app"><main class="body"><div class="state" id="state-empty">${ic('location-dot')}<h2>No places yet</h2><p>Save the places your group cares about: where you are staying, where to eat, what to see. Each can be found on the map and linked from a trip, an event or a task.</p><p><button class="btn btn-primary" type="button" data-action="add-place">Add a place</button></p></div></main></div>`;
  else if (state === 'noresults') body = `<div class="app" id="app">${head}<div class="chips" id="chips">${chips()}</div><main class="body"><div class="state" id="state-noresults"><h2>Nothing matches</h2><p>No place matches your filter.</p><p><button class="btn" type="button" data-action="clear-filter">Show everything</button></p></div></main></div>`;
  else body = `<div class="app" id="app">${head}<div class="chips" id="chips">${chips()}</div><main class="body" id="body">${groups()}</main>${state === 'menu' ? menu : ''}${found}${['editor', 'viewer', 'conflict'].includes(state) ? editor() : ''}</div>`;
  document.body.insertAdjacentHTML('beforeend', body);
  const app = document.getElementById('app');
  const fit = () => app.classList.toggle('narrow', document.body.clientWidth < 720);
  fit(); new ResizeObserver(fit).observe(document.body);
}
</script>
</body>
</html>
