<!doctype html><html><head><meta charset="utf-8"></head>
<body><h1>probe page</h1><p id="out" class="hint">running...</p>
<script>
(async()=>{ const r={};
 try {
  const t=await tavern.ready(); r.ready=true; r.user=t.user.name; r.can={view:tavern.can('view'),edit:tavern.can('edit')}; r.scope=t.context.scope;
  r.bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  await tavern.storage.set('self:test',{n:1}); const got=await tavern.storage.get('self:test'); r.get=got.value.n;
  r.list=(await tavern.storage.list('self:')).length;
  try{ await tavern.storage.set('self:test',{n:2},{version:99}); r.conflict='none' }catch(e){ r.conflict=e.status+':'+(e.current&&e.current.version) }
  r.missing=await tavern.storage.get('nope');
  try{ r.fetch=await fetch('/api/me').then(()=> 'allowed',()=> 'blocked'); }catch(e){ r.fetch='blocked' }
  try{ r.parent = parent.document.title ? 'allowed' : 'empty'; }catch(e){ r.parent='blocked' }

  tavern.on('change',e=>{ if(e.key==='ext:ping'){ tavern.storage.set('selftest',{...r,live:e.value}); } });
 } catch(e){ r.error=e.message }
 document.getElementById('out').textContent=JSON.stringify(r);
 await tavern.storage.set('selftest', r);
})();
</script></body></html>
